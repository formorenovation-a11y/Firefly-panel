/* ============================================================
   GANANCIAS DEL EMPLEADO — reutilizable para vendedor y motorizado
   Muestra: acumulado del período actual + historial de pagos
   ============================================================ */
async function bloqueGananciasEmpleado(usuarioId, nombreUsuario){
  try{
    const [emps,peds,pagos]=await Promise.all([dbAll('nominaEmpleados'),dbAll('pedidos'),dbAll('nominaPagos')]);
    // Buscar el registro de nómina de este usuario
    const emp=emps.find(e=>e.usuarioId===usuarioId)||emps.find(e=>e.nombre===nombreUsuario);
    if(!emp)return ''; // no tiene nómina configurada, no mostrar nada

    // Período actual
    const hoy=new Date();
    const periodo=emp.frecuenciaPago==='MENSUAL'?getPeriodoCustom(hoy.getFullYear(),hoy.getMonth(),'M')
      :getPeriodoCustom(hoy.getFullYear(),hoy.getMonth(),hoy.getDate()<=15?'Q1':'Q2');
    const calc=calcComisionEmpleado(emp,peds,periodo);

    // Historial de pagos de este empleado
    const misPagos=pagos.filter(p=>p.empleadoId===emp.id&&p.estado==='PAGADO').sort((a,b)=>b.fecha-a.fecha).slice(0,6);
    const totalPagadoMes=pagos.filter(p=>p.empleadoId===emp.id&&p.estado==='PAGADO'&&thisMonth(p.fecha)).reduce((a,p)=>a+(p.total||0),0);

    const tipoLabel=emp.tipo==='COMISION'?`${emp.comisionPct}% comisión`:emp.tipo==='SALARIO'?'Salario fijo':`Salario + ${emp.comisionPct}%`;

    return `
    <div class="sec-title">Mis ganancias <span class="h">${esc(periodo.labelShort||periodo.label)}</span></div>
    <div class="card" style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px">
        <div>
          <div style="font-size:11px;color:var(--muted2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px">Acumulado del período</div>
          <div style="font-family:var(--mono);font-weight:800;font-size:30px;letter-spacing:-.02em;color:var(--glow)">${usd(calc.total)}</div>
          <div style="font-size:11.5px;color:var(--muted)">${tipoLabel} · ${emp.frecuenciaPago==='MENSUAL'?'mensual':'quincenal'}</div>
        </div>
        <div style="text-align:right">
          <span class="tag" style="background:rgba(84,214,132,.12);color:var(--ok)">en curso</span>
        </div>
      </div>
      ${calc.salario>0||calc.comision>0?`<div style="border-top:1px solid var(--line);padding-top:10px">
        ${calc.salario>0?`<div class="stat2"><span class="k">Salario base</span><span class="v">${usd(calc.salario)}</span></div>`:''}
        ${calc.comisionPct>0?`<div class="stat2"><span class="k">Comisión ${emp.comisionPct}% (${calc.pedidos} pedidos)</span><span class="v">${usd(calc.comisionPct)}</span></div>`:''}
        ${calc.comisionUnidad>0?`<div class="stat2"><span class="k">Comisión ${usd(emp.comisionPorUnidad)}/u (${calc.unidades} unidades)</span><span class="v">${usd(calc.comisionUnidad)}</span></div>`:''}
        <div class="stat2"><span class="k" style="color:var(--white);font-weight:600">Total a recibir</span><span class="v" style="color:var(--glow)">${usd(calc.total)}</span></div>
      </div>`:'<div style="font-size:12px;color:var(--muted2);text-align:center;padding:8px 0">Aún no hay ventas en este período</div>'}
    </div>
    ${misPagos.length?`
    <div class="sec-title">Historial de pagos <span class="h">${totalPagadoMes>0?usd(totalPagadoMes)+' este mes':''}</span></div>
    <div class="list" style="margin-bottom:16px">
      ${misPagos.map(p=>`<div class="li">
        <div class="av" style="font-size:12px;background:rgba(84,214,132,.15);color:var(--ok)">✓</div>
        <div class="gr"><div class="t">${usd(p.total)}</div>
          <div class="s">${esc(p.periodo||'')} · ${p.metodoPago?esc(p.metodoPago)+' · ':''}${fechaCorta(p.fecha)}</div></div>
        ${p.comision>0&&p.salario>0?`<div style="text-align:right;font-size:10px;color:var(--muted2)">sal ${usd(p.salario)}<br>com ${usd(p.comision)}</div>`:''}
      </div>`).join('')}
    </div>`:`
    <div class="card" style="margin-bottom:16px;text-align:center;padding:16px;color:var(--muted2);font-size:12.5px">
      Aún no tienes pagos registrados. Cuando el equipo procese tu pago aparecerá aquí.
    </div>`}`;
  }catch(e){console.error('bloqueGanancias error',e);return '';}
}

<script>
/* ===== Login · luciérnaga voladora en la selva ===== */
(function(){
  const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  let run=false,raf=0,timers=[],cv,cx,fv,fx,fly,home,W=0,H=0,DPR=1,P=70,L=[],perches=[],bugs=[],glints=[],trail=[],sparks=[],st=null,t0=0;
  let cam={x:0,y:0},camT={x:0,y:0},ptr={x:0,y:0};
  const TRAIL_MS=1000;
  const rnd=(a,b)=>a+Math.random()*(b-a);

  const bez=(p0,p1,p2,p3,t)=>{const u=1-t;return u*u*u*p0+3*u*u*t*p1+3*u*t*t*p2+t*t*t*p3;};
  function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  /* ── dibujo de vegetación (siluetas) ── */
  function frond(g,x,y,len,ang,curl,n,w,col,R,perch){
    const pt=t=>{const a=ang+curl*t;return{x:x+Math.cos(ang+curl*t*.5)*len*t,y:y+Math.sin(ang+curl*t*.5)*len*t+len*.18*t*t,a};};
    g.fillStyle=col;g.strokeStyle=col;g.lineWidth=Math.max(1.2,w*.09);g.lineCap='round';
    g.beginPath();for(let i=0;i<=24;i++){const p=pt(i/24);i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y);}g.stroke();
    for(let i=2;i<=n;i++){const t=i/n,p=pt(t),ll=w*Math.pow(Math.sin(Math.PI*Math.min(1,t*1.08)),.7)*(1-t*.35);
      for(const sd of[-1,1]){const a=p.a+sd*(1.05-.45*t)+R()*.12+.25*(1-t)*.5,ex=p.x+Math.cos(a)*ll,ey=p.y+Math.sin(a)*ll+ll*.22,
        nx=Math.cos(a+sd*1.57)*ll*.09,ny=Math.sin(a+sd*1.57)*ll*.09;
        g.beginPath();g.moveTo(p.x,p.y);g.quadraticCurveTo((p.x+ex)/2+nx,(p.y+ey)/2+ny,ex,ey);g.quadraticCurveTo((p.x+ex)/2-nx*.3,(p.y+ey)/2-ny*.3,p.x+Math.cos(p.a)*3,p.y+Math.sin(p.a)*3);g.fill();}}

  }
  function leaf(g,x,y,len,ang,col,R,slits,perch){
    g.save();g.translate(x,y);g.rotate(ang);const w=len*.42;
    g.fillStyle=col;g.beginPath();g.moveTo(0,0);g.bezierCurveTo(len*.1,-w*1.05,len*.7,-w*.9,len*1.02,0);g.bezierCurveTo(len*.7,w*.9,len*.1,w*1.05,0,0);g.fill();
    if(slits){g.globalCompositeOperation='destination-out';for(let i=1;i<=slits;i++){const t=i/(slits+1),sx=len*t;for(const sd of[-1,1]){g.beginPath();g.moveTo(sx,sd*w*.12);g.quadraticCurveTo(sx+len*.06,sd*w*.45,sx+len*.05,sd*w*1.05);g.lineWidth=len*.03;g.strokeStyle='#000';g.stroke();}}g.globalCompositeOperation='source-over';}
    g.strokeStyle='rgba(120,170,110,.10)';g.lineWidth=1.2;g.beginPath();g.moveTo(0,0);g.lineTo(len*.95,0);g.stroke();
    g.restore();if(perch){const c=Math.cos(ang),s=Math.sin(ang);perch.push({x:x+c*len*.55,y:y+s*len*.55-6});}
  }
  function trunk(g,x,w,col,R,top,bot){

    for(let i=0;i<=20;i++){const t=i/20,yy=bot-(bot-top)*t,xx=x+lean*t+Math.sin(t*3+k)*6,ww=w*(1-t*.45);i?g.lineTo(xx-ww/2,yy):g.moveTo(xx-ww/2,yy);}

  function liana(g,a,b,sag,col,wd){g.strokeStyle=col;g.lineWidth=wd;g.beginPath();g.moveTo(a.x,a.y);g.quadraticCurveTo((a.x+b.x)/2,Math.max(a.y,b.y)+sag,b.x,b.y);g.stroke();}

  function rim(g,w,h,col,a){g.save();g.globalCompositeOperation='source-atop';const gr=g.createLinearGradient(w*.85,0,w*.2,h);gr.addColorStop(0,col);gr.addColorStop(1,'rgba(0,0,0,0)');g.globalAlpha=a;g.fillStyle=gr;g.fillRect(0,0,w,h);g.restore();}
  function mk(){const c=document.createElement('canvas');c.width=(W+2*P)*DPR;c.height=(H+2*P)*DPR;const g=c.getContext('2d');g.setTransform(DPR,0,0,DPR,P,P);return{c,g};}

      const m=g.createRadialGradient(W*.78,H*.1,0,W*.78,H*.1,Math.max(W,H)*.5);m.addColorStop(0,'rgba(190,230,170,.10)');m.addColorStop(.25,'rgba(120,190,130,.035)');m.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=m;g.fillRect(-P,-P,W+2*P,H+2*P);
      g.fillStyle='rgba(225,245,210,.28)';g.beginPath();g.arc(W*.78,H*.1,Math.max(7,13*S),0,6.28);g.fill();

  function homeRect(){const r=home.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2,s:r.width/56};}
  function later(fn,ms){const id=setTimeout(fn,ms);timers.push(id);return id;}
  function place(x,y,s,rot){fly.style.transform=`translate3d(${x}px,${y}px,0) translate(-50%,-50%) scale(${s}) rotate(${rot}deg)`;
    const d=Math.max(0,Math.min(1,(s-.5)/.95));fly.style.filter=`drop-shadow(0 0 ${6+12*d}px rgba(205,235,69,${.4+.4*d})) brightness(${.6+.5*d})`;fly.style.opacity=(.6+.4*d).toFixed(2);
    fly.style.zIndex=s>1.12?3:1;}
  function blocked(x,y){const box=[...document.querySelectorAll('#loginScreen .login-card,#loginScreen .login-logo h1,#loginScreen .login-logo p')].map(e=>e.getBoundingClientRect());return box.some(r=>x>r.left-40&&x<r.right+40&&y>r.top-30&&y<r.bottom+30);}
  function plan(now){
    const h=homeRect(),pts=[{x:h.x,y:h.y,s:h.s}];
    const ok=perches.filter(p=>{const q=perchPos(p,now);return q.x>40&&q.x<W-40&&q.y>40&&q.y<H-40&&!blocked(q.x,q.y);});
    const n=Math.round(rnd(4,6)),used=new Set();
    for(let i=0;i<n;i++){const prev=pts[pts.length-1];const c=ok.filter(p=>!used.has(p)).map(p=>({p,q:perchPos(p,now)})).filter(o=>Math.hypot(o.q.x-prev.x,o.q.y-prev.y)>Math.min(W,H)*.25);
      if(c.length&&Math.random()<.85){const o=c[Math.floor(Math.random()*c.length)];used.add(o.p);pts.push({x:o.q.x,y:o.q.y,s:o.p.s,perch:o.p});}
      else{let x,y,k=0;do{x=rnd(80,W-80);y=rnd(80,H-80);k++;}while(k<60&&blocked(x,y));pts.push({x,y,s:rnd(.6,1.1)});}}
    pts.push({x:h.x,y:h.y,s:h.s,home:1});
    const segs=[];for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],dx=b.x-a.x,dy=b.y-a.y,Ln=Math.hypot(dx,dy)||1,nx=-dy/Ln,ny=dx/Ln,bend=rnd(-.45,.45)*Ln;
      segs.push({a,b,c1:{x:a.x+dx*.3+nx*bend,y:a.y+dy*.3+ny*bend-(i===1?Ln*.25:0)},c2:{x:a.x+dx*.7+nx*bend*.6,y:a.y+dy*.7+ny*bend*.6-30},dur:Math.max(1200,Math.min(2800,Ln*2.7)),hold:b.home?0:(b.perch?rnd(1500,2600):rnd(700,1200))});}
    return segs;
  }
  function wings(on){fly.classList.toggle('wings',on);}
  function start(){
    if(RM||run)return;const scr=document.getElementById('loginScreen');if(!scr||scr.classList.contains('hide'))return;
    cv=document.getElementById('ffSky');fv=document.getElementById('ffFront');fly=document.getElementById('ffFly');home=document.querySelector('.login-logo>svg');if(!cv||!fv||!fly||!home)return;
    cx=cv.getContext('2d');fx=fv.getContext('2d');run=true;t0=performance.now();size();trail=[];sparks=[];st=null;
    raf=requestAnimationFrame(loop);later(takeoff,2000);
  }
  function takeoff(){
    if(!run)return;const h=homeRect();place(h.x,h.y,h.s,0);fly.classList.add('on');home.classList.add('away');wings(true);
    later(()=>{if(!run)return;st={segs:plan(performance.now()),i:0,t:performance.now(),phase:'fly',x:h.x,y:h.y,s:h.s,rot:0};},900);
  }
  function land(){wings(false);fly.classList.remove('rest');later(()=>{if(!run)return;fly.classList.remove('on');home.classList.remove('away');st=null;later(takeoff,rnd(5000,8000));},650);}
  function target(sg,now){if(sg.b.perch){const q=perchPos(sg.b.perch,now);return{x:q.x,y:q.y};}if(sg.b.home){const h=homeRect();return{x:h.x,y:h.y};}return sg.b;}
  function step(now){
    if(!st)return;const sg=st.segs[st.i];
    if(st.phase==='hold'){const k=(now-st.t)/1000,T=target(sg,now),pr=!!sg.b.perch;
      const bx=T.x+(pr?Math.sin(k*1.3)*1.2:Math.sin(k*2.4)*6),by=T.y+(pr?0:Math.cos(k*3.1)*5);st.x=bx;st.y=by;st.rot*=.88;place(bx,by,sg.b.s,st.rot);
      if(now-st.t>sg.hold){fly.classList.remove('rest');st.i++;st.t=now;st.phase='fly';if(st.i>=st.segs.length){land();st=null;}}return;}
    const t=Math.min(1,(now-st.t)/sg.dur),e=ease(t),T=target(sg,now);
    const x=bez(sg.a.x,sg.c1.x,sg.c2.x,T.x,e),y=bez(sg.a.y,sg.c1.y,sg.c2.y,T.y,e);
    const s=sg.a.s+(sg.b.s-sg.a.s)*e+Math.sin(Math.PI*e)*.15;
    const vx=x-st.x,vy=y-st.y,sp=Math.hypot(vx,vy);
    st.rot=st.rot*.85+Math.max(-28,Math.min(28,vx*1.6))*.15;st.x=x;st.y=y;st.s=s;place(x,y,s,st.rot);
    fly.style.setProperty('--flap',sp>2?'.11s':'.18s');
    if(sp>.4){trail.push({x,y:y+8*s,s,t:now});for(let q=0;q<(sp>6?2:1);q++)if(Math.random()<.7)sparks.push({x:x+rnd(-6,6)*s,y:y+rnd(0,14)*s,vx:rnd(-.3,.3)-vx*.05,vy:rnd(.1,.6)-vy*.05,t:now,r:rnd(.6,1.8)*s});}
    if(t>=1){if(sg.b.home){st.i++;land();st=null;return;}st.phase='hold';st.t=now;if(sg.b.perch)fly.classList.add('rest');}
  }
  function draw(now){
    const k=(now-t0)/1000;
    const fxp=st?st.x:W/2,fyp=st?st.y:H/2;camT.x=(fxp-W/2)/W*2*.6+ptr.x*.4;camT.y=(fyp-H/2)/H*2*.6+ptr.y*.4;cam.x+=(camT.x-cam.x)*.04;cam.y+=(camT.y-cam.y)*.04;
    cx.clearRect(0,0,W,H);
    for(let i=0;i<3;i++){const o=off(L[i],now);cx.drawImage(L[i].c,0,0,L[i].c.width,L[i].c.height,o.x-P,o.y-P,W+2*P,H+2*P);
      if(i===1){/* niebla entre capas */for(let f=0;f<3;f++){const fy=H*(.5+f*.16),fxo=((k*(8+f*5)+f*300)%(W+600))-300;const gr=cx.createRadialGradient(fxo,fy,0,fxo,fy,W*.45);gr.addColorStop(0,`rgba(170,215,190,${.07-f*.015})`);gr.addColorStop(1,'rgba(170,215,190,0)');cx.fillStyle=gr;cx.fillRect(0,0,W,H);
          const fx2=W-fxo,gr2=cx.createRadialGradient(fx2,fy+40,0,fx2,fy+40,W*.35);gr2.addColorStop(0,'rgba(150,200,175,.05)');gr2.addColorStop(1,'rgba(150,200,175,0)');cx.fillStyle=gr2;cx.fillRect(0,0,W,H);}}}
    /* luciérnagas de fondo */
    cx.save();cx.globalCompositeOperation='lighter';
    for(const b of bugs){b.a+=rnd(-.08,.08);b.x+=Math.cos(b.a)*b.v*b.z;b.y+=Math.sin(b.a)*b.v*b.z*.6-.05;if(b.x<-10)b.x=W+10;if(b.x>W+10)b.x=-10;if(b.y<H*.1)b.y=H;if(b.y>H+10)b.y=H*.2;
      const bl=Math.max(0,Math.sin(k*b.v*3+b.p));if(bl<.05)continue;const o=off(L[2],now),x=b.x+o.x*b.z,y=b.y+o.y*b.z,r=1.2+b.z*2.2;
      const gr=cx.createRadialGradient(x,y,0,x,y,r*5);gr.addColorStop(0,`rgba(220,250,120,${(.55*bl*b.z+.1).toFixed(3)})`);gr.addColorStop(1,'rgba(205,235,69,0)');cx.fillStyle=gr;cx.fillRect(x-r*5,y-r*5,r*10,r*10);}
    /* halo de la luciérnaga que ilumina el entorno */
    if(st||fly.classList.contains('on')){const r=150*(st?st.s:1);const gr=cx.createRadialGradient(fxp,fyp,0,fxp,fyp,r);gr.addColorStop(0,'rgba(205,235,69,.16)');gr.addColorStop(1,'rgba(205,235,69,0)');cx.fillStyle=gr;cx.fillRect(fxp-r,fyp-r,2*r,2*r);}
    cx.restore();
    /* estela de neón */
    while(trail.length&&now-trail[0].t>TRAIL_MS)trail.shift();while(sparks.length&&now-sparks[0].t>TRAIL_MS)sparks.shift();
    if(trail.length>1){cx.save();cx.globalCompositeOperation='lighter';cx.lineCap='round';cx.lineJoin='round';
      for(const pass of [[18,.05],[8,.14],[3.2,.38],[1.6,.95]]){for(let i=1;i<trail.length;i++){const a=trail[i-1],b=trail[i],life=1-(now-b.t)/TRAIL_MS;if(life<=0)continue;
        cx.strokeStyle=pass[1]>.5?`rgba(236,255,170,${(life*pass[1]).toFixed(3)})`:`rgba(205,235,69,${(life*pass[1]).toFixed(3)})`;cx.lineWidth=pass[0]*b.s*(.35+.65*life);cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke();}}
      cx.restore();}
    if(sparks.length){cx.save();cx.globalCompositeOperation='lighter';for(const p of sparks){const life=1-(now-p.t)/TRAIL_MS;p.x+=p.vx;p.y+=p.vy;cx.fillStyle=`rgba(215,245,110,${(life*.9).toFixed(3)})`;cx.beginPath();cx.arc(p.x,p.y,p.r*life+.2,0,6.283);cx.fill();}cx.restore();}
    /* follaje cercano (lienzo delantero) + luz de la luciérnaga sobre las hojas */
    fx.clearRect(0,0,W,H);const o3=off(L[3],now);fx.drawImage(L[3].c,0,0,L[3].c.width,L[3].c.height,o3.x-P,o3.y-P,W+2*P,H+2*P);
    if(st){fx.save();fx.globalCompositeOperation='source-atop';const r=220*st.s,gr=fx.createRadialGradient(fxp,fyp,0,fxp,fyp,r);gr.addColorStop(0,'rgba(205,235,69,.26)');gr.addColorStop(.45,'rgba(160,210,60,.07)');gr.addColorStop(1,'rgba(0,0,0,0)');fx.fillStyle=gr;fx.fillRect(fxp-r,fyp-r,2*r,2*r);fx.restore();}
    fx.save();fx.globalCompositeOperation='lighter';for(const g of glints){const a=Math.max(0,Math.sin(k*1.7+g.p))**6;if(a<.02)continue;fx.fillStyle=`rgba(230,255,220,${(a*.8).toFixed(3)})`;fx.beginPath();fx.arc(g.x+o3.x,g.y+o3.y,1.4,0,6.28);fx.fill();}fx.restore();
  }
  function loop(now){const scr=document.getElementById('loginScreen');if(!run||!scr||scr.classList.contains('hide')){stop();return;}step(now);draw(now);raf=requestAnimationFrame(loop);}
  function stop(){run=false;cancelAnimationFrame(raf);timers.forEach(clearTimeout);timers=[];st=null;if(fly)fly.classList.remove('on','wings','rest');if(home)home.classList.remove('away');if(cx)cx.clearRect(0,0,W,H);if(fx)fx.clearRect(0,0,W,H);}
  window.addEventListener('resize',()=>{if(run){size();if(!st&&fly&&fly.classList.contains('on')){const h=homeRect();place(h.x,h.y,h.s,0);}}});
  window.addEventListener('pointermove',e=>{ptr.x=(e.clientX/innerWidth-.5)*2;ptr.y=(e.clientY/innerHeight-.5)*2;},{passive:true});
  window.ffFlyStart=start;window.ffFlyStop=stop;
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();

</script>
</body>
