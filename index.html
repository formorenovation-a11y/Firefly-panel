/* ===== Chats flotantes con clientes (Instagram / Messenger) ===== */
async function p3Chats(){
  let dock=document.getElementById('p3Dock');
  if(!dock){document.body.insertAdjacentHTML('beforeend','<div id="p3Dock" class="p3dock"></div><div id="p3Win" class="p3win" hidden></div>');dock=document.getElementById('p3Dock');}
  dock.hidden=false;const c=await cfg();
  if(!c.metaPageToken||!(c.metaPageId)){dock.innerHTML=`<button class="p3bub conn" title="Conectar chats de Instagram y Facebook" onclick="window._ajSubNext='meta';go('admin')">${ic('msg')}<span>Conectar chats</span></button>`;return;}
  dock.innerHTML=`<button class="p3bub head" onclick="p3ChatList()" title="Chats con clientes">${ic('msg')}<i class="p3ub" hidden></i></button>`;
  try{
    let L=window._p3ChC&&Date.now()-window._p3ChC.ts<30e3?window._p3ChC.list:null;
    if(!L){const f='id,updated_time,unread_count,participants,messages.limit(1){message,from,created_time}';
      const rs=await Promise.allSettled([p3Graph(`${c.metaPageId}/conversations?platform=instagram&fields=${f}&limit=12`,c.metaPageToken),p3Graph(`${c.metaPageId}/conversations?platform=messenger&fields=${f}&limit=12`,c.metaPageToken)]);
      L=[];rs.forEach((r,i)=>{if(r.status!=='fulfilled')return;(r.value.data||[]).forEach(cv=>{const me=[c.metaPageId,c.metaIgUserId].filter(Boolean);const who=(cv.participants?.data||[]).find(p=>!me.includes(p.id))||{};const m=cv.messages?.data?.[0]||{};
        L.push({id:cv.id,plat:i===0?'Instagram':'Facebook',name:who.username||who.name||'Cliente',uid:who.id,t:Date.parse(cv.updated_time)||0,unread:+cv.unread_count||0,last:m.message||'(adjunto)',lastMine:me.includes(m.from?.id)});});});
      if(!L.length&&rs.every(r=>r.status==='rejected'))throw rs[0].reason;
      L.sort((a,b)=>b.t-a.t);window._p3ChC={ts:Date.now(),list:L};}
    window._p3Ch=L;if(S.route!=='p360'){dock.hidden=true;return;}
    const unread=L.reduce((a,x)=>a+(x.unread?1:0),0);
    dock.innerHTML=`<button class="p3bub head" onclick="p3ChatList()" title="Chats con clientes">${ic('msg')}${unread?`<i class="p3ub">${unread}</i>`:''}</button>`+L.slice(0,5).map((x,i)=>`<button class="p3bub" style="--d:${i*40}ms" onclick="p3ChatOpen('${x.id}')" title="${esc(x.name)} · ${esc(x.last)}"><span class="p3av">${esc((x.name||'?').replace('@','').charAt(0).toUpperCase())}</span>${metTile(x.plat,18)}${x.unread?'<i class="p3dot"></i>':''}<span class="p3prev"><b>${esc(x.name)}</b><small>${x.lastMine?'Tú: ':''}${esc(x.last.slice(0,60))}</small><em>${esc(fechaRel(x.t))}</em></span></button>`).join('');
  }catch(e){dock.innerHTML=`<button class="p3bub conn bad" title="${esc(e.message)}" onclick="window._ajSubNext='meta';go('admin')">${ic('alert')}<span>Chats: revisa permisos de Meta</span></button>`;}
}
function p3ChatList(){
  const L=window._p3Ch||[],w=$('#p3Win');w.hidden=false;
  w.innerHTML=`<div class="p3wh"><b>Chats con clientes</b><small>Instagram y Facebook</small><button class="xbtn" aria-label="Cerrar" onclick="$('#p3Win').hidden=true">${ic('x')}</button></div><div class="p3wl">${L.length?L.map(x=>`<button class="p3wr" onclick="p3ChatOpen('${x.id}')"><span class="p3av">${esc((x.name||'?').replace('@','').charAt(0).toUpperCase())}</span>${metTile(x.plat,18)}<span class="p3wt"><b>${esc(x.name)}</b><small>${x.lastMine?'Tú: ':''}${esc(x.last.slice(0,70))}</small></span><em>${esc(fechaRel(x.t))}</em>${x.unread?'<i class="p3dot"></i>':''}</button>`).join(''):'<div class="trempty">Sin conversaciones recientes.</div>'}</div>`;
}
async function p3ChatOpen(id){
  const x=(window._p3Ch||[]).find(y=>y.id===id);if(!x)return;const w=$('#p3Win');w.hidden=false;window._p3Open=x;
  w.innerHTML=`<div class="p3wh"><button class="xbtn" aria-label="Volver" onclick="p3ChatList()">${ic('chevL')}</button><span class="p3av">${esc((x.name||'?').replace('@','').charAt(0).toUpperCase())}</span><div style="flex:1;min-width:0"><b>${esc(x.name)}</b><small>${metIco(x.plat)} ${x.plat}</small></div><button class="xbtn" aria-label="Cerrar" onclick="$('#p3Win').hidden=true">${ic('x')}</button></div>
   <div class="p3msgs" id="p3Msgs"><div class="spload">${ic('refresh')}Cargando…</div></div>
   <form class="p3send" onsubmit="event.preventDefault();p3ChatSend()"><input id="p3Txt" placeholder="Escribe una respuesta…" autocomplete="off" maxlength="1000"><button class="btn-lime" aria-label="Enviar">${ic('send')}</button></form>
   <div class="p3note">Meta solo permite responder dentro de las 24 h siguientes al último mensaje del cliente.</div>`;
  await p3ChatLoad();
}
async function p3ChatLoad(){
  const x=window._p3Open,c=await cfg(),el=$('#p3Msgs');if(!x||!el)return;
  try{const j=await p3Graph(`${x.id}?fields=messages.limit(25){message,from,created_time,attachments}`,c.metaPageToken);const me=[c.metaPageId,c.metaIgUserId].filter(Boolean);
    const M=(j.messages?.data||[]).slice().reverse();
    el.innerHTML=M.map(m=>{const mine=me.includes(m.from?.id);return `<div class="p3m ${mine?'me':''}"><span>${esc(m.message||(m.attachments?'📎 Adjunto':''))}</span><small>${esc(agHM(Date.parse(m.created_time)))}</small></div>`;}).join('')||'<div class="trempty">Sin mensajes.</div>';el.scrollTop=el.scrollHeight;
  }catch(e){el.innerHTML=`<div class="warnbox">${ic('alert')}<span>No se pudieron leer los mensajes: ${esc(e.message)}</span></div>`;}
}
async function p3ChatSend(){
  const x=window._p3Open,inp=$('#p3Txt'),txt=(inp?.value||'').trim();if(!x||!txt)return;const c=await cfg();
  inp.disabled=true;
  try{const r=await fetch(GRAPH+c.metaPageId+'/messages?access_token='+encodeURIComponent(c.metaPageToken),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({recipient:{id:x.uid},message:{text:txt},messaging_type:'RESPONSE'})});
    const j=await r.json().catch(()=>({}));if(!r.ok||j.error)throw new Error(j.error?.message||'HTTP '+r.status);
    inp.value='';const el=$('#p3Msgs');el.insertAdjacentHTML('beforeend',`<div class="p3m me"><span>${esc(txt)}</span><small>ahora</small></div>`);el.scrollTop=el.scrollHeight;window._p3ChC=null;
  }catch(e){toast('No se envió: '+e.message,'bad');}
  inp.disabled=false;inp.focus();
}

     ${['vendedor','motorizado','supervisor','admin','socio'].map(r=>`<option value="${r}" ${u.rol===r?'selected':''}>${r}</option>`).join('')}</select></div>
   <div class="hintline" style="margin-bottom:14px">Color según rol: <span style="color:#CDEB45">■</span> admin  <span style="color:#5db4f5">■</span> socio  <span style="color:#f5b945">■</span> supervisor  <span style="color:#54d684">■</span> vendedor</div>
   <button class="btn pri full" onclick="saveUser()">Guardar</button>
   ${id&&id!==S.user.id?`<button class="btn gho dang full" style="margin-top:8px" onclick="delUser('${id}')">Eliminar usuario</button>`:''}`);}

async function saveUser(){
  const u=window._eu;
  if(!u.nombre){toast('Falta el nombre','bad');return;}
  if(!u.id){
    if(!u.email){toast('Falta el correo','bad');return;}
    if(!u.newPass||u.newPass.length<6){toast('Contraseña mínimo 6 caracteres','bad');return;}
    try{
      // Crear cuenta Firebase Auth sin cerrar sesión actual
      const secApp=firebase.initializeApp(FIREBASE_CONFIG,'sec_'+Date.now());
      const cred=await secApp.auth().createUserWithEmailAndPassword(u.email,u.newPass);
      const newUid=cred.user.uid;
      await secApp.auth().signOut();
      await secApp.delete().catch(()=>{});
      u.id=newUid;
    }catch(e){
      toast({'auth/email-already-in-use':'Este email ya está registrado',
        'auth/weak-password':'Contraseña muy débil'}[e.code]||'Error: '+e.code,'bad');return;
    }
  }
  u.color=COLORES_ROL[u.rol]||'#CDEB45';
  const {newPass,...profile}=u;
  await dbPut('usuarios',profile);
  toast('Usuario guardado ✓','ok');closeSheet();
}
async function delUser(id){confirmSheet('¿Eliminar usuario?','El usuario perderá acceso pero su cuenta de Firebase se mantiene.',async()=>{await dbDel('usuarios',id);toast('Eliminado');closeSheet();});}

/* ============================================================
   REPORTES
   ============================================================ */
function getRangoFechas(p){
  const hoy=new Date(),y=hoy.getFullYear(),m=hoy.getMonth();
  const ts=d=>d.getTime();
  const qStart=q=>new Date(y,(q-1)*3,1);
  const qEnd=q=>new Date(y,q*3,0,23,59,59);
  const ranges={
    mes:    {desde:ts(new Date(y,m,1)),  hasta:ts(hoy),                          label:'Este mes'},
    mes_ant:{desde:ts(new Date(y,m-1,1)),hasta:ts(new Date(y,m,0,23,59,59)),     label:'Mes anterior'},
    d30:    {desde:ts(new Date(hoy-30*86400000)),hasta:ts(hoy),                  label:'Últimos 30 días'},
    d90:    {desde:ts(new Date(hoy-90*86400000)),hasta:ts(hoy),                  label:'Últimos 90 días'},
    '6m':   {desde:ts(new Date(hoy-182*86400000)),hasta:ts(hoy),                 label:'Últimos 6 meses'},
    '1y':   {desde:ts(new Date(hoy-365*86400000)),hasta:ts(hoy),                 label:'Último año'},
    '2y':   {desde:ts(new Date(hoy-730*86400000)),hasta:ts(hoy),                 label:'Últimos 2 años'},
    q1:     {desde:ts(qStart(1)),hasta:ts(qEnd(1)),                              label:'Q1 '+y},
    q2:     {desde:ts(qStart(2)),hasta:ts(qEnd(2)),                              label:'Q2 '+y},
    q3:     {desde:ts(qStart(3)),hasta:ts(qEnd(3)),                              label:'Q3 '+y},
    q4:     {desde:ts(qStart(4)),hasta:ts(qEnd(4)),                              label:'Q4 '+y},
    anio:   {desde:ts(new Date(y,0,1)),hasta:ts(hoy),                            label:'Año '+y},
    hoy:    {desde:ts(new Date(y,m,hoy.getDate())),hasta:ts(hoy),                label:'Hoy'},
    ayer:   {desde:ts(new Date(y,m,hoy.getDate()-1)),hasta:ts(new Date(y,m,hoy.getDate()-1,23,59,59)),label:'Ayer'},
    d7:     {desde:ts(new Date(hoy-7*86400000)),hasta:ts(hoy),                   label:'Últimos 7 días'},
  };
  if(p==='custom'&&S.filters.customDesde&&S.filters.customHasta){
    const cd=new Date(S.filters.customDesde),ch=new Date(S.filters.customHasta);
    ch.setHours(23,59,59);
    const fmt=d=>d.toLocaleDateString('es-VE',{day:'numeric',month:'short'});
    return{desde:cd.getTime(),hasta:ch.getTime(),label:fmt(cd)+' → '+fmt(ch)};
  }
  return ranges[p]||ranges.mes;
}

/* ── Selector de rango personalizado (reutilizable) ── */
function abrirRangoCustom(filtroKey,viewFn){
  const hoy=new Date().toISOString().slice(0,10);
  const hace30=new Date(Date.now()-30*86400000).toISOString().slice(0,10);
  openSheet(`<div class="sh-head"><h3>📅 Rango personalizado</h3></div>
   <div class="row">
     <div class="field"><label>Desde</label>
       <input type="date" id="rangoDesde" class="inp" value="${S.filters.customDesde||hace30}" max="${hoy}"></div>
     <div class="field"><label>Hasta</label>
       <input type="date" id="rangoHasta" class="inp" value="${S.filters.customHasta||hoy}" max="${hoy}"></div>
   </div>
   <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">
     ${[['Hoy',0,0],['Ayer',1,1],['7 días',7,0],['14 días',14,0],['30 días',30,0],['90 días',90,0]].map(([lab,dias,fin])=>`
       <button class="btn sm" style="font-size:11px" onclick="
         document.getElementById('rangoDesde').value=new Date(Date.now()-${dias}*86400000).toISOString().slice(0,10);
         document.getElementById('rangoHasta').value=new Date(Date.now()-${fin}*86400000).toISOString().slice(0,10);
       ">${lab}</button>`).join('')}
   </div>
   <button class="btn pri full" onclick="aplicarRangoCustom('${filtroKey}','${viewFn}')">Aplicar rango</button>`);
}
function aplicarRangoCustom(filtroKey,viewFn){
  const d=document.getElementById('rangoDesde')?.value;
  const h=document.getElementById('rangoHasta')?.value;
  if(!d||!h){toast('Selecciona ambas fechas','bad');return;}
  if(d>h){toast('La fecha inicial debe ser anterior a la final','bad');return;}
  S.filters.customDesde=d;S.filters.customHasta=h;
  S.filters[filtroKey]='custom';
  closeSheet();window[viewFn]();
}

async function viewReportes(){
  const v=document.getElementById('view');
  v.innerHTML=skelView(2,4);
  const periodo=S.filters.repPeriodo||'mes';
  const rango=getRangoFechas(periodo);
  const[peds,prods,sedes]=await Promise.all([dbAll('pedidos'),dbAll('productos'),dbAll('sedes')]);
  const ventas=peds.filter(p=>p.estado!=='CANCELADO'&&p.fecha>=rango.desde&&p.fecha<=rango.hasta);

  /* ── Acumuladores ── */
  const porVend={},porSede={},porCanal={},porProd={},porMetodo={},porAgencia={};
  sedes.forEach(s=>{porSede[s.id]={label:s.codigo+' · '+s.nombre,pedidos:0,unidades:0,ventas:0,pickup:0,nac:0};});
  CANALES.forEach(k=>{porCanal[k]={label:CANAL_N[k],pedidos:0,unidades:0,ventas:0};});

  ventas.forEach(p=>{
    const sub=p.subtotalUSD||0;
    const uds=(p.items||[]).reduce((a,i)=>a+i.cantidad,0);
    // vendedor
    const v=p.vendedorNombre||'Sin asignar';
    if(!porVend[v])porVend[v]={label:v,pedidos:0,unidades:0,ventas:0,pendiente:0};
    porVend[v].pedidos++;porVend[v].unidades+=uds;porVend[v].ventas+=sub;
    if(p.totalPagadoUSD<p.totalUSD-0.5)porVend[v].pendiente+=p.totalUSD-p.totalPagadoUSD;
    // sede
    if(!porSede[p.sedeId])porSede[p.sedeId]={label:p.sedeId,pedidos:0,unidades:0,ventas:0,pickup:0,nac:0};
    porSede[p.sedeId].pedidos++;porSede[p.sedeId].unidades+=uds;porSede[p.sedeId].ventas+=sub;
    if(p.tipoEntrega==='PICKUP')porSede[p.sedeId].pickup++;
    if(p.tipoEntrega==='ENVIO_NACIONAL')porSede[p.sedeId].nac++;
    // canal
    if(!porCanal[p.canal])porCanal[p.canal]={label:CANAL_N[p.canal]||p.canal,pedidos:0,unidades:0,ventas:0};
    porCanal[p.canal].pedidos++;porCanal[p.canal].unidades+=uds;porCanal[p.canal].ventas+=sub;
    // producto
    (p.items||[]).forEach(i=>{
      if(!porProd[i.version])porProd[i.version]={label:i.version,unidades:0,ventas:0};
      porProd[i.version].unidades+=i.cantidad;porProd[i.version].ventas+=i.precio*i.cantidad;
    });
    // método de pago
    (p.pagos||[]).forEach(pg=>{
      const met=pg.metodo||'Sin método';
      if(!porMetodo[met])porMetodo[met]={label:met,total:0,count:0};
      porMetodo[met].total+=pg.montoUSD||0;porMetodo[met].count++;
    });
    // agencia envío nacional
    if(p.tipoEntrega==='ENVIO_NACIONAL'){
      const ag=p.agenciaEnvio||'Sin especificar';
      if(!porAgencia[ag])porAgencia[ag]={label:ag,pedidos:0,unidades:0,ventas:0};
      porAgencia[ag].pedidos++;porAgencia[ag].unidades+=uds;porAgencia[ag].ventas+=sub;
    }
  });

  const totalVentas=ventas.reduce((a,p)=>a+(p.subtotalUSD||0),0);
  const totalUnidades=ventas.reduce((a,p)=>a+(p.items||[]).reduce((x,i)=>x+i.cantidad,0),0);
  const totalNac=ventas.filter(p=>p.tipoEntrega==='ENVIO_NACIONAL').length;
  const ticketProm=ventas.length?totalVentas/ventas.length:0;
  const pendienteCobro=ventas.reduce((a,p)=>a+Math.max(0,(p.totalUSD||0)-(p.totalPagadoUSD||0)),0);

  /* ── Helper: fila con barra horizontal ── */
  function barRow(item,maxVal,colorVar='var(--glow)'){
    const pct=maxVal>0?Math.round(item.ventas/maxVal*100):0;
    return `<div style="padding:10px 0;border-bottom:1px solid var(--line)">
      <div style="display:flex;justify-content:space-between;margin-bottom:5px">
        <span style="font-size:13px;font-weight:600">${esc(item.label)}</span>
        <span class="mono" style="font-size:12.5px">${usd(item.ventas)}</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div style="flex:1;height:8px;background:var(--panel3);border-radius:4px;overflow:hidden">
          <div style="width:${pct}%;height:100%;background:${colorVar};border-radius:4px;transition:width .5s"></div>
        </div>
        <span style="font-size:11px;color:var(--muted);min-width:60px;text-align:right">${item.pedidos||0} ped · ${item.unidades||0} u</span>
      </div>
    </div>`;
  }

  /* ── Helper: tabla simple ── */
  function tablaRow(label,vals,colors){
    return `<div style="display:flex;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);gap:8px">
      <span style="flex:1;font-size:13px">${esc(label)}</span>
      ${vals.map((v,i)=>`<span class="mono" style="font-size:12px;color:${colors?colors[i]:'var(--white)'};min-width:55px;text-align:right">${v}</span>`).join('')}
    </div>`;
  }

  const sortByVentas=obj=>Object.values(obj).sort((a,b)=>b.ventas-a.ventas);
  const maxVend=Math.max(1,...Object.values(porVend).map(x=>x.ventas));
  const maxSede=Math.max(1,...Object.values(porSede).map(x=>x.ventas));
  const maxCanal=Math.max(1,...Object.values(porCanal).map(x=>x.ventas));
  const maxProd=Math.max(1,...Object.values(porProd).map(x=>x.unidades));

  const periodoChips=['mes','mes_ant','q1','q2','q3','q4'].map(p=>{
    const r=getRangoFechas(p);
    return `<button class="stbtn ${periodo===p?'on':''}" onclick="S.filters.repPeriodo='${p}';viewReportes()">${r.label}</button>`;
  }).join('')+`<button class="stbtn ${periodo==='custom'?'on':''}" onclick="abrirRangoCustom('repPeriodo','viewReportes')">📅 ${periodo==='custom'?getRangoFechas('custom').label:'Personalizado'}</button>`;

  v.innerHTML=`
  <div class="view-head"><div><div class="eyebrow">Análisis del negocio</div><h2>Reportes</h2>
    <div class="sub">${rango.label}</div></div></div>
  <div class="statusbar" style="margin-bottom:14px">${periodoChips}</div>

  <!-- KPIs ejecutivos -->
  <div class="grid g2" style="margin-bottom:6px">
    <div class="kpi accent"><div class="lab">Ventas (producto)</div><div class="val">${usd(totalVentas)}</div><div class="delta">${ventas.length} pedidos</div></div>
    <div class="kpi"><div class="lab">Unidades vendidas</div><div class="val">${totalUnidades}</div><div class="delta">ticket ${usd(ticketProm)}</div></div>
    <div class="kpi"><div class="lab">Por cobrar</div><div class="val ${pendienteCobro>0?'down':''}">${usd(pendienteCobro)}</div><div class="delta">de pedidos activos</div></div>
    <div class="kpi"><div class="lab">Envíos nacionales</div><div class="val">${totalNac}</div><div class="delta">${ventas.length>0?Math.round(totalNac/ventas.length*100):0}% del total</div></div>
  </div>

  <!-- Por vendedor -->
  <div class="sec-title">Por vendedor <span class="h">comparativo de ventas</span></div>
  <div class="card">
    ${vBarCompareSVG(Object.values(porVend).sort((a,b)=>b.ventas-a.ventas).slice(0,8).map(d=>({label:d.label,value:Math.round(d.ventas),color:'var(--glow)'})),{fmtVal:v=>'$'+v})}
  </div>
  <div class="card" style="margin-top:10px">
    <div style="display:flex;justify-content:space-between;padding:0 0 6px;font-size:11px;color:var(--muted);font-family:var(--mono);border-bottom:1px solid var(--line)">
      <span>VENDEDOR</span><span>VENTAS · PED · UNID · POR COBRAR</span></div>
    ${Object.values(porVend).sort((a,b)=>b.ventas-a.ventas).map(d=>`
      <div style="padding:10px 0;border-bottom:1px solid var(--line)">
        <div style="display:flex;justify-content:space-between;margin-bottom:5px">
          <span style="font-size:13px;font-weight:600">${esc(d.label)}</span>
          <span class="mono" style="font-size:13px;color:var(--glow)">${usd(d.ventas)}</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <div style="flex:1;height:8px;background:var(--panel3);border-radius:4px;overflow:hidden">
            <div style="width:${maxVend>0?Math.round(d.ventas/maxVend*100):0}%;height:100%;background:var(--glow);border-radius:4px"></div>
          </div>
          <span style="font-size:11px;color:var(--muted);white-space:nowrap">${d.pedidos}p · ${d.unidades}u${d.pendiente>0?' · <span style="color:var(--warn)">debe '+usd(d.pendiente)+'</span>':''}</span>
        </div>
      </div>`).join('')||'<div class="empty" style="padding:14px">Sin ventas en este período</div>'}
  </div>

  <!-- Por sede -->
  <div class="sec-title">Por sede <span class="h">distribución geográfica</span></div>
  <div class="card" style="margin-bottom:10px">
    ${(()=>{const dSede=Object.values(porSede).filter(d=>d.pedidos>0).sort((a,b)=>b.ventas-a.ventas);

  </div>
  <div class="card">
    ${Object.values(porSede).filter(d=>d.pedidos>0).sort((a,b)=>b.ventas-a.ventas).map(d=>`
      <div style="padding:10px 0;border-bottom:1px solid var(--line)">
        <div style="display:flex;justify-content:space-between;margin-bottom:5px">

          <span class="mono" style="font-size:13px">${usd(d.ventas)}</span>

async function loadConvReporte(rango){
  const el=document.getElementById('convReporteSection');
  if(!el)return;
  const[convs,usuarios,c]=await Promise.all([dbAll('convDiarias'),dbAll('usuarios'),cfg()]);
  const enRango=convs.filter(x=>x.fecha>=rango.desde&&x.fecha<=rango.hasta);

  // Acumulados por canal
  const totWS=enRango.reduce((a,x)=>a+(x.WS||0),0);
  const totIG=enRango.reduce((a,x)=>a+(x.IG||0),0);
  const totFB=enRango.reduce((a,x)=>a+(x.FB||0),0);
  const totAll=totWS+totIG+totFB;

  // Por vendedor
  const porVend={};
  enRango.forEach(x=>{
    const k=x.usuarioNombre||'Sin asignar';
    if(!porVend[k])porVend[k]={nombre:k,WS:0,IG:0,FB:0,total:0};
    porVend[k].WS+=x.WS||0;porVend[k].IG+=x.IG||0;porVend[k].FB+=x.FB||0;
    porVend[k].total+=(x.WS||0)+(x.IG||0)+(x.FB||0);
  });

  // Últimos 14 días para la tendencia
  const dias=[];
  for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);dias.push({
    lab:d.getDate()+'/'+(d.getMonth()+1),key:d.toDateString(),WS:0,IG:0,FB:0});}
  enRango.forEach(x=>{const k=new Date(x.fecha).toDateString();const dia=dias.find(d=>d.key===k);
    if(dia){dia.WS+=x.WS||0;dia.IG+=x.IG||0;dia.FB+=x.FB||0;}});
  const maxDia=Math.max(1,...dias.map(d=>d.WS+d.IG+d.FB));
  const barsHTML=dias.map(d=>{
    const tot=d.WS+d.IG+d.FB;const pct=Math.max(2,Math.round(tot/maxDia*100));
    return`<div style="display:flex;flex-direction:column;align-items:center;flex:1;gap:3px">
      <div style="width:100%;border-radius:4px 4px 0 0;overflow:hidden;height:60px;display:flex;flex-direction:column;justify-content:flex-end">
        <div style="height:${Math.round((d.WS/maxDia)*60)}px;background:var(--ok);min-height:${d.WS?2:0}px"></div>
        <div style="height:${Math.round((d.IG/maxDia)*60)}px;background:var(--purple);min-height:${d.IG?2:0}px"></div>
        <div style="height:${Math.round((d.FB/maxDia)*60)}px;background:var(--info);min-height:${d.FB?2:0}px"></div>
      </div>
      <span style="font-size:8.5px;color:var(--muted2);font-family:var(--mono)">${d.lab}</span>
    </div>`;}).join('');

  const metaConectado=!!(c.metaPageToken);
  const rankVend=Object.values(porVend).sort((a,b)=>b.total-a.total);
  const maxVend=rankVend.length?rankVend[0].total:1;

  el.innerHTML=`
    <div class="grid g3" style="margin-bottom:14px">
      <div class="kpi"><div class="lab" style="color:var(--ok)">WhatsApp</div><div class="val">${totWS}</div><div class="delta">conversaciones</div></div>
      <div class="kpi"><div class="lab" style="color:var(--purple)">Instagram</div><div class="val">${totIG}</div><div class="delta">${metaConectado?'API':'manual'}</div></div>
      <div class="kpi"><div class="lab" style="color:var(--info)">Facebook</div><div class="val">${totFB}</div><div class="delta">${metaConectado?'API':'manual'}</div></div>
    </div>
    <div class="card" style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <span style="font-size:12px;font-weight:600">Tendencia 14 días</span>
        <div style="display:flex;gap:10px;font-size:10px;font-family:var(--mono)">
          <span><span style="color:var(--ok)">■</span> WS</span>
          <span><span style="color:var(--purple)">■</span> IG</span>
          <span><span style="color:var(--info)">■</span> FB</span>
        </div>
      </div>
      <div style="display:flex;align-items:flex-end;gap:3px;height:74px">${barsHTML}</div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <span style="font-size:13px;font-weight:600">Por vendedor</span>
      <div style="display:flex;gap:7px">
        ${metaConectado?`<button class="btn sm" onclick="pullMetaConversaciones()">↓ Importar Meta</button>`:'<span class="miniml" style="color:var(--muted2)">Meta no configurado</span>'}
        <button class="btn pri sm" onclick="openLogConversaciones()">+ Registrar</button>
      </div>
    </div>
    ${rankVend.length?rankVend.map(d=>`
      <div style="padding:9px 0;border-bottom:1px solid var(--line)">
        <div style="display:flex;justify-content:space-between;margin-bottom:5px">
          <span style="font-size:13px;font-weight:600">${esc(d.nombre)}</span>
          <span class="mono" style="font-size:12px">${d.total} total</span>
        </div>
        <div style="display:flex;gap:6px;align-items:center">
          ${[['WS','var(--ok)'],['IG','var(--purple)'],['FB','var(--info)']].map(([ch,col])=>`
            <div style="flex:1;height:7px;background:var(--panel3);border-radius:4px;overflow:hidden" title="${ch}: ${d[ch]}">
              <div style="width:${maxVend>0?Math.round(d[ch]/maxVend*100):0}%;height:100%;background:${col}"></div>
            </div>
            <span style="font-size:10px;color:var(--muted);min-width:22px">${d[ch]}</span>`).join('')}
        </div>
      </div>`).join('')
    :`<div class="empty" style="padding:18px 0">Sin conversaciones registradas en este período.<br>
      Toca "+ Registrar" para añadir el conteo diario.</div>`}
    <div class="hintline" style="margin-top:10px">
      ℹ️ WS = WhatsApp (manual) · IG = Instagram · FB = Facebook — 
      <a onclick="adminMetaConfig()" style="color:var(--glow)">Conectar Meta API ›</a>
    </div>`;
}

async function saveLogConversaciones(){
  const dia=document.getElementById('cvDia')?.value||new Date().toISOString().slice(0,10);
  const [uid,unom]=(document.getElementById('cvUsuario')?.value||S.user.id+'|'+S.user.nombre).split('|');

  const ig=parseInt(document.getElementById('cvIG')?.value)||0;
  const fb=parseInt(document.getElementById('cvFB')?.value)||0;
  if(ws+ig+fb===0){toast('Ingresa al menos un canal','bad');return;}
  // Buscar si ya existe un registro de este usuario para este día
  const existing=await dbAll('convDiarias');
  const prev=existing.find(x=>x.dia===dia&&x.usuarioId===uid);
  const obj={id:prev?.id||uid('cv'),fecha:new Date(dia).getTime(),dia,

async function testMetaConnection(){
  const token=document.getElementById('mpToken')?.value.trim();
  const pageId=document.getElementById('mpPageId')?.value.trim();
  const el=document.getElementById('metaTestResult');
  if(!token||!pageId){el.innerHTML='<span style="color:var(--bad)">Ingresa el Page ID y el Token primero.</span>';return;}
  el.innerHTML='Probando…';
  try{
    const resp=await fetch(`https://graph.facebook.com/v19.0/${pageId}?fields=name,fan_count&access_token=${token}`);
    const data=await resp.json();
    if(data.error){el.innerHTML=`<span style="color:var(--bad)">Error: ${esc(data.error.message)}</span>`;}
    else{el.innerHTML=`<span style="color:var(--ok)">✓ Conectado: <b>${esc(data.name)}</b> (${(data.fan_count||0).toLocaleString()} seguidores)</span>`;}
  }catch(e){el.innerHTML=`<span style="color:var(--bad)">Error de red: ${e.message}</span>`;}
}

async function pullMetaConversaciones(){
  const c=await cfg();
  if(!c.metaPageToken){toast('Configura Meta Business en Ajustes primero','bad');return;}
  toast('Importando de Meta…');
  const hoy=new Date().toISOString().slice(0,10);
  const ayer=new Date(Date.now()-86400000).toISOString().slice(0,10);
  let importados=0;

  // ── Facebook Page conversations (mensajes de las últimas 24h) ──
  if(c.metaPageId){
    try{
      const url=`https://graph.facebook.com/v19.0/${c.metaPageId}/conversations?fields=updated_time,message_count&limit=200&access_token=${c.metaPageToken}`;
      const resp=await fetch(url);const data=await resp.json();
      if(!data.error&&data.data){
        // Contar conversaciones actualizadas hoy y ayer
        const hoyCount=data.data.filter(conv=>{
          const d=new Date(conv.updated_time).toISOString().slice(0,10);
          return d===hoy;}).length;
        const ayerCount=data.data.filter(conv=>{
          const d=new Date(conv.updated_time).toISOString().slice(0,10);
          return d===ayer;}).length;
        // Guardar hoy
        if(hoyCount>0){
          const existing=await dbAll('convDiarias');
          const prev=existing.find(x=>x.dia===hoy&&x.usuarioId==='meta_fb');
          await dbPut('convDiarias',{id:prev?.id||uid('cv'),fecha:Date.now(),dia:hoy,
            usuarioId:'meta_fb',usuarioNombre:'Facebook Page (API)',WS:0,IG:0,FB:hoyCount,
            total:hoyCount,fuente:'META_API',ts:Date.now()});
          importados+=hoyCount;
        }
        if(ayerCount>0){
          const existing=await dbAll('convDiarias');
          const prev=existing.find(x=>x.dia===ayer&&x.usuarioId==='meta_fb');
          await dbPut('convDiarias',{id:prev?.id||uid('cv'),fecha:new Date(ayer).getTime(),dia:ayer,
            usuarioId:'meta_fb',usuarioNombre:'Facebook Page (API)',WS:0,IG:0,FB:ayerCount,
            total:ayerCount,fuente:'META_API',ts:Date.now()});
          importados+=ayerCount;
        }
      }else if(data.error){toast('Error FB: '+data.error.message,'bad');}
    }catch(e){toast('Error al importar Facebook: '+e.message,'bad');}
  }

  // ── Instagram conversations ──
  if(c.metaIgUserId){
    try{
      const url=`https://graph.facebook.com/v19.0/${c.metaIgUserId}/conversations?platform=instagram&fields=updated_time,message_count&limit=200&access_token=${c.metaPageToken}`;
      const resp=await fetch(url);const data=await resp.json();
      if(!data.error&&data.data){
        const hoyIG=data.data.filter(conv=>new Date(conv.updated_time).toISOString().slice(0,10)===hoy).length;
        const ayerIG=data.data.filter(conv=>new Date(conv.updated_time).toISOString().slice(0,10)===ayer).length;
        if(hoyIG>0){
          const existing=await dbAll('convDiarias');
          const prev=existing.find(x=>x.dia===hoy&&x.usuarioId==='meta_ig');
          await dbPut('convDiarias',{id:prev?.id||uid('cv'),fecha:Date.now(),dia:hoy,
            usuarioId:'meta_ig',usuarioNombre:'Instagram (API)',WS:0,IG:hoyIG,FB:0,
            total:hoyIG,fuente:'META_API',ts:Date.now()});
          importados+=hoyIG;
        }
        if(ayerIG>0){
          const existing=await dbAll('convDiarias');
          const prev=existing.find(x=>x.dia===ayer&&x.usuarioId==='meta_ig');
          await dbPut('convDiarias',{id:prev?.id||uid('cv'),fecha:new Date(ayer).getTime(),dia:ayer,
            usuarioId:'meta_ig',usuarioNombre:'Instagram (API)',WS:0,IG:ayerIG,FB:0,
            total:ayerIG,fuente:'META_API',ts:Date.now()});
          importados+=ayerIG;
        }
      }else if(data.error){toast('Error IG: '+data.error.message,'bad');}
    }catch(e){toast('Error al importar Instagram: '+e.message,'bad');}
  }

  // ── WhatsApp Business Platform (solo si tienen Cloud API) ──
  if(c.metaWabaId){
    try{
      const since=Math.floor((Date.now()-2*86400000)/1000);
      const until=Math.floor(Date.now()/1000);
      const url=`https://graph.facebook.com/v19.0/${c.metaWabaId}/analytics?start=${since}&end=${until}&granularity=DAY&access_token=${c.metaPageToken}`;
      const resp=await fetch(url);const data=await resp.json();
      if(!data.error&&data.data_points){
        for(const pt of data.data_points){
          const dia=new Date(pt.start*1000).toISOString().slice(0,10);
          const count=pt.conversation||0;
          if(count>0){
            const existing=await dbAll('convDiarias');
            const prev=existing.find(x=>x.dia===dia&&x.usuarioId==='meta_wa');
            await dbPut('convDiarias',{id:prev?.id||uid('cv'),fecha:new Date(dia).getTime(),dia,
              usuarioId:'meta_wa',usuarioNombre:'WhatsApp Business (API)',WS:count,IG:0,FB:0,
              total:count,fuente:'META_API',ts:Date.now()});
            importados+=count;
          }
        }
      }

function periodoActual(){
  const hoy=new Date(),dia=hoy.getDate();
  return getPeriodoCustom(hoy.getFullYear(),hoy.getMonth(),dia<=15?'Q1':'Q2');
}
function periodoMensual(){
  const hoy=new Date();
  return getPeriodoCustom(hoy.getFullYear(),hoy.getMonth(),'M');
}
function getPeriodoCustom(y,m,seg){
  const mesN=new Date(y,m,1).toLocaleDateString('es-VE',{month:'long',year:'numeric'});
  const mesNShort=new Date(y,m,1).toLocaleDateString('es-VE',{month:'long'});
  if(seg==='Q1')return{
    desde:new Date(y,m,1).getTime(),hasta:new Date(y,m,15,23,59,59).getTime(),
    label:'1–15 de '+mesN,labelShort:'1–15 '+mesNShort,
    tipo:'QUINCENAL',key:y+'-'+String(m+1).padStart(2,'0')+'-Q1'};
  if(seg==='Q2'){const d=new Date(y,m+1,0).getDate();return{
    desde:new Date(y,m,16).getTime(),hasta:new Date(y,m+1,0,23,59,59).getTime(),
    label:'16–'+d+' de '+mesN,labelShort:'16–'+d+' '+mesNShort,
    tipo:'QUINCENAL',key:y+'-'+String(m+1).padStart(2,'0')+'-Q2'};}
  return{
    desde:new Date(y,m,1).getTime(),hasta:new Date(y,m+1,0,23,59,59).getTime(),
    label:mesN+' completo',labelShort:mesNShort+' completo',
    tipo:'MENSUAL',key:y+'-'+String(m+1).padStart(2,'0')+'-M'};
}
function nomNavPrev(){
  if(!S.filters.nomYear){const hoy=new Date();S.filters.nomYear=hoy.getFullYear();S.filters.nomMonth=hoy.getMonth();S.filters.nomSeg=hoy.getDate()<=15?'Q1':'Q2';}
  const seg=S.filters.nomSeg||'Q1';
  if(seg==='Q2'){S.filters.nomSeg='Q1';}
  else if(seg==='M'){
    if(S.filters.nomMonth===0){S.filters.nomMonth=11;S.filters.nomYear--;}
    else S.filters.nomMonth--;
  } else {
    if(S.filters.nomMonth===0){S.filters.nomMonth=11;S.filters.nomYear--;}
    else S.filters.nomMonth--;
    S.filters.nomSeg='Q2';
  }
  viewNomina();
}
function nomNavNext(){
  if(!S.filters.nomYear){const hoy=new Date();S.filters.nomYear=hoy.getFullYear();S.filters.nomMonth=hoy.getMonth();S.filters.nomSeg=hoy.getDate()<=15?'Q1':'Q2';}
  const seg=S.filters.nomSeg||'Q1';
  if(seg==='Q1'){S.filters.nomSeg='Q2';}
  else if(seg==='M'){
    if(S.filters.nomMonth===11){S.filters.nomMonth=0;S.filters.nomYear++;}
    else S.filters.nomMonth++;
  } else {
    if(S.filters.nomMonth===11){S.filters.nomMonth=0;S.filters.nomYear++;}
    else S.filters.nomMonth++;
    S.filters.nomSeg='Q1';
  }
  viewNomina();
}


/* ── Etiqueta legible de remuneración (incluye comisión por unidad) ── */
function labelRemun(e){
  const parts=[];
  if(e.salarioBase>0)parts.push(usd(e.salarioBase));
  if(e.comisionPct>0)parts.push(e.comisionPct+'%');
  if(e.comisionPorUnidad>0)parts.push(usd(e.comisionPorUnidad)+'/u');
  return parts.length?parts.join(' + '):'Sin remuneración';
}

function calcComisionEmpleado(emp,peds,periodo){
  // La comisión se calcula sobre el TOTAL de ventas del canal/sede asignados,
  // no sobre las ventas individuales del empleado.
  // Si Frank y Mariangélica comparten WS, ambos reciben 1.5% del total de WS.
  const{desde,hasta}=periodo;
  const mis=peds.filter(p=>{
    if(p.estado==='CANCELADO')return false;
    if(p.fecha<desde||p.fecha>hasta)return false;
    // SIN filtro por vendedor — cuenta todas las ventas del canal/sede
    if(emp.sedes&&!emp.sedes.includes('todas')&&!emp.sedes.includes(p.sedeId))return false;
    if(emp.canales&&!emp.canales.includes('todas')&&!emp.canales.includes(p.canal))return false;
    return true;
  });
  const ventasTotal=mis.reduce((a,p)=>a+(p.subtotalUSD||p.totalUSD||0),0);
  const unidades=mis.reduce((a,p)=>a+(p.items||[]).reduce((x,i)=>x+i.cantidad,0),0);
  const comisionPct=Math.round(ventasTotal*(emp.comisionPct||0)/100*100)/100; // comisión sobre %
  const comisionUnidad=Math.round((emp.comisionPorUnidad||0)*unidades*100)/100; // $ fijo por linterna
  const comision=Math.round((comisionPct+comisionUnidad)*100)/100; // comisión total combinada
  const salario=emp.tipo==='COMISION'?0:(emp.salarioBase||0);
  return{ventasTotal,unidades,comision,comisionPct,comisionUnidad,salario,total:salario+comision,pedidos:mis.length,detalle:mis};
}

async function loadCajas(){
  const el=document.getElementById('cajasSection');
  if(!el)return;
  el.innerHTML='<div class="miniml" style="padding:8px 0">Cargando cajas…</div>';
  const [sedes,peds,cajaMovs,c]=await Promise.all([dbAll('sedes'),dbAll('pedidos'),dbAll('cajaMovs'),cfg()]);

  // Calcular saldo por sede: ventas cash + movimientos manuales
  function saldoSede(sedeId){
    // Entradas: pagos en Cash$ o Efectivo de pedidos entregados/vendidos
    let saldo=0;
    for(const p of peds){
      if(p.sedeId!==sedeId||p.estado==='CANCELADO')continue;
      for(const pg of p.pagos||[]){
        if(pg.metodo==='Cash $') saldo+=pg.montoUSD||0;
        if(pg.metodo==='Efectivo Bs'&&pg.tasa>0) saldo+=(pg.montoBs||0)/pg.tasa;
      }
    }
    // Movimientos manuales
    for(const m of cajaMovs.filter(x=>!x._anulado)){
      if(m.sedeId!==sedeId)continue;
      if(m.tipo==='ENTRADA') saldo+=m.montoUSD||0;
      if(m.tipo==='SALIDA')  saldo-=m.montoUSD||0;
    }
    return saldo;
  }

  // Últimos movimientos (todo tipo)
  const recientes=cajaMovs.slice().sort((a,b)=>b.fecha-a.fecha).slice(0,20);

  const rows=sedes.map(s=>{
    const saldo=saldoSede(s.id);
    return `<div class="kpi ${saldo<0?'':''}">
      <div class="lab">${s.codigo} · ${s.nombre}</div>
      <div class="val" style="color:${saldo<0?'var(--bad)':saldo<20?'var(--warn)':'var(--ok)'}">${usd(saldo)}</div>
      <div class="delta">efectivo físico estimado</div>
      <div style="display:flex;gap:7px;margin-top:10px">
        <button class="btn sm" style="flex:1" onclick="openCajaMov('${s.id}','SALIDA')">Retiro</button>
        <button class="btn sm" style="flex:1" onclick="openCajaMov('${s.id}','ENTRADA')">Depósito</button>
      </div>
    </div>`;
  }).join('');

  const mvRows=recientes.length?recientes.map(m=>{
    const s=sedes.find(x=>x.id===m.sedeId);
    const col=m.esVueltoBs?'var(--warn)':m.tipo==='SALIDA'?'var(--bad)':'var(--ok)';
    const ico=m._anulado?'✗':m.esVueltoBs?'💱':m.tipo==='SALIDA'?'↑':'↓';
    const esManual=!m.esVueltoBs&&!m.esDeliveryPedido;
    const colFinal=m._anulado?'var(--muted2)':col;
    return `<div class="li" ${esManual&&!m._anulado?`onclick="editCajaMov('${m.id}')"`:''} style="${esManual&&!m._anulado?'cursor:pointer':'opacity:'+(m._anulado?.5:1)}">
      <div class="av" style="font-size:12px;background:${colFinal}22;color:${colFinal}">${ico}</div>
      <div class="gr"><div class="t" style="${m._anulado?'text-decoration:line-through;color:var(--muted2)':''}">${esc(m.concepto||m.tipo)}</div>
        <div class="s">${s?s.codigo:''} · ${fechaCorta(m.fecha)}${m._anulado?` · <b style="color:var(--bad)">ANULADO</b> por ${esc(m._anuladoPor||'')} — ${esc(m._anuladoMotivo||'')}`:''}</div></div>
      <div style="text-align:right;flex:none">
        <div class="amt" style="color:${colFinal};${m._anulado?'text-decoration:line-through':''}">${m.tipo==='SALIDA'?'−':'+'}${usd(m.montoUSD||0)}</div>
        ${esManual&&!m._anulado?`<div style="font-size:10px;color:var(--muted2);margin-top:2px">toca para editar</div>`:''}
      </div></div>`;}).join('')
    :'<div class="empty" style="padding:14px 0">Sin movimientos manuales aún</div>';

  el.innerHTML=`
    <div class="alert" style="margin-bottom:12px;font-size:12px;background:rgba(84,214,132,.08);border-color:rgba(84,214,132,.25);color:#9ae6b4"><span>✓</span><div><b>Registro automático:</b> todos los pagos en Cash $ y Efectivo Bs de los pedidos ya se suman aquí automáticamente por sede. Solo registra manualmente los egresos (retiros, pagos al delivery, etc.).</div></div>
    <div class="alert info" style="margin-bottom:12px;font-size:12px">
      <span>ℹ️</span><div>El saldo incluye todas las ventas cobradas en <b>Cash $</b> y <b>Efectivo Bs</b> (convertido a USD) menos los retiros registrados. Úsalo como referencia del efectivo físico en cada sede.</div>
    </div>
    <div class="grid g2" style="margin-bottom:14px">${rows}</div>
    <div style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em;font-family:var(--mono)">Últimos movimientos</div>
    <div class="list">${mvRows}</div>`;
}

   PARSER DE MENSAJES — Claude AI extrae datos del WhatsApp
   ============================================================ */

/* ============================================================
   PARSER LOCAL — lee la plantilla del mensaje SIN necesitar API
   Funciona para todos los usuarios sin importar red/CORS
   ============================================================ */
function parseLocalTemplate(msg){
  const out={};
  const lines=msg.split('\n').map(l=>l.trim()).filter(Boolean);
  const grab=(regex)=>{
    for(const l of lines){const m=l.match(regex);if(m&&m[1]&&m[1].trim())return m[1].trim();}
    return null;
  };
  // Nombre
  out.nombre=grab(/^nombre\s*[:=]\s*(.+)$/i);
  // Cédula (solo si tiene contenido)
  const ced=grab(/^c[eé]dula\s*[:=]\s*(.+)$/i);
  if(ced&&/\d{5,}/.test(ced))out.cedula=ced.replace(/[^\dVvEe-]/g,'');
  // Teléfono
  const tel=grab(/^tel[eé]fono\s*[:=]\s*(.+)$/i);
  if(tel&&/\d{6,}/.test(tel.replace(/\D/g,'')))out.telefono=tel;
  // Tipo de entrega
  const ent=grab(/^(?:delivery\/pickup\/env[ií]o|tipo de entrega|entrega)\s*[:=]\s*(.+)$/i);
  if(ent){
    const e=ent.toLowerCase();
    if(e.includes('delivery'))out.tipoEntrega='DELIVERY';
    else if(e.includes('pickup')||e.includes('retiro'))out.tipoEntrega='PICKUP';
    else if(e.includes('env'))out.tipoEntrega='ENVIO_NACIONAL';
  }
  // Dirección
  out.direccion=grab(/^direcci[oó]n(?:\s*\(si aplica\))?\s*[:=]\s*(.+)$/i);
  if(out.direccion)out.ciudad=out.direccion;
  // Link de ubicación (google maps / waze)
  const linkMatch=msg.match(/(https?:\/\/(?:www\.)?(?:google\.[a-z.]+\/maps|maps\.google|maps\.app\.goo\.gl|goo\.gl\/maps|waze\.com)[^\s]*)/i);
  if(linkMatch)out.direccionLink=linkMatch[1];
  // Producto (modelo)
  const lin=grab(/^linterna\s*[:=]\s*(.+)$/i)||grab(/^modelo\s*[:=]\s*(.+)$/i);
  if(lin){
    const l=lin.toLowerCase();
    if(/modelo\s*1|1\s*l[ií]nea|una?\s*(banda|l[ií]nea)/.test(l))out.productoVersion='LC1';
    else if(/modelo\s*3|3\s*l[ií]neas?|tres\s*(bandas?|l[ií]neas?)/.test(l))out.productoVersion='LC3';
    else if(/llavero/.test(l))out.productoVersion='LL';
  }
  // Cantidad
  const cant=grab(/^cantidad\s*[:=]\s*(.+)$/i);
  if(cant){const n=parseInt(cant.replace(/\D/g,''));if(n>0)out.cantidad=n;}
  // Método de pago
  const met=grab(/^m[eé]todo de pago\s*[:=]\s*(.+)$/i);
  if(met){
    const m=met.toLowerCase();
    if(m.includes('pago m')||m.includes('pagomovil')||m.includes('pago-m'))out.metodoPago='Pago Móvil';
    else if(m.includes('zelle'))out.metodoPago='Zelle';
    else if(m.includes('binance'))out.metodoPago='Binance';
    else if(m.includes('paypal'))out.metodoPago='PayPal';
    else if(m.includes('efectivo')&&m.includes('bs'))out.metodoPago='Efectivo Bs';
    else if(m.includes('cash')||m.includes('efectivo')||m.includes('divisa')||m.includes('$'))out.metodoPago='Cash $';
  }
  // Canal (WhatsApp / tienda)
  const canal=grab(/^(?:tienda o whatsapp|canal)\s*[:=]\s*(.+)$/i);
  if(canal){
    const cl=canal.toLowerCase();
    if(cl.includes('whats'))out.canal='WS';
    else if(cl.includes('insta'))out.canal='IG';
    else if(cl.includes('tienda')||cl.includes('shopify')||cl.includes('web'))out.canal='SHOPIFY';
    else if(cl.includes('mercado'))out.canal='ML';
  }
  return out;
}

function aplicarParseResult(p){
  let campos=0;
  if(p.nombre){_draft.cliente.nombre=p.nombre;campos++;}
  if(p.cedula){_draft.cliente.cedula=p.cedula;campos++;}
  if(p.telefono){_draft.cliente.telefono=p.telefono;campos++;}
  if(p.direccion){_draft.cliente.direccion=p.direccion;campos++;}
  if(p.direccionLink){_draft.cliente.direccionLink=p.direccionLink;campos++;}
  if(p.canal&&CANALES.includes(p.canal)){_draft.canal=p.canal;campos++;}
  if(p.tipoEntrega&&['DELIVERY','PICKUP','ENVIO_NACIONAL'].includes(p.tipoEntrega)){_draft.tipoEntrega=p.tipoEntrega;campos++;}
  if(p.agenciaEnvio)_draft.agenciaEnvio=p.agenciaEnvio;
  if(p.ciudad){
    const c2=p.ciudad.toLowerCase();
    const sedes=S.cache.sedes||[];
    const map=[['caracas','CCS'],['ordaz','PZO'],['guayana','PZO'],['la cruz','PLC'],['barcelona','PLC'],['anzo','PLC'],['barquisimeto','BQTO'],['valencia','VLC'],['maracaibo','MBO'],['cabudare','CBD'],['lara','BQTO']];
    for(const[kw,cod]of map)if(c2.includes(kw)){const s=sedes.find(x=>x.codigo===cod);if(s){_draft.sedeId=s.id;break;}}
  }
  if(p.productoVersion){
    const prod=(S.cache.prods||[]).find(pr=>pr.version===p.productoVersion&&pr.activo);
    if(prod){const qty=Math.max(1,parseInt(p.cantidad)||1);
      _draft.items=[{productoId:prod.id,version:prod.version,nombre:prod.nombre,cantidad:qty,precio:precioUnit(prod,qty,_draft._divisas)}];campos++;}
  }
  if(p.metodoPago&&METODOS.includes(p.metodoPago)){_draft._metodoPrevisto=p.metodoPago;campos++;}
  return campos;
}

async function parseAndFill(){
  const msg=document.getElementById('parseMsg')?.value?.trim();
  if(!msg){toast('Pega el mensaje primero','bad');return;}
  const btn=document.getElementById('parseBtn');
  if(btn){btn.textContent='⚡ Analizando…';btn.disabled=true;}

  // ── PASO 1: Parser local de plantilla (instantáneo, sin internet) ──
  const local=parseLocalTemplate(msg);
  Object.keys(local).forEach(k=>{if(local[k]==null)delete local[k];});
  const camposLocal=Object.keys(local).length;

  // Si la plantilla dio suficientes datos, aplicar directo — no necesita API
  if(camposLocal>=3){
    const n=aplicarParseResult(local);
    _draft._showParser=false;
    renderOrderSheet();
    toast(`⚡ ${n} campo(s) rellenados al instante — revisa y completa`,'ok');
    return;
  }

  // ── PASO 2: Mensaje no sigue la plantilla → intentar con IA ──
  if(btn){btn.textContent='✨ Analizando con IA…';}
  try{
    const conf=await cfg();
    const apiKey=conf.anthropicKey||'';
    if(!apiKey){
      // Sin API key: aplicar lo poco que encontró el parser local
      if(camposLocal>0){
        const n=aplicarParseResult(local);
        _draft._showParser=false;renderOrderSheet();
        toast(`⚡ ${n} campo(s) del mensaje — completa el resto manual`,'ok');
      }else{
        toast('El mensaje no sigue la plantilla y no hay API key configurada — rellena manual','bad');
        if(btn){btn.textContent='✨ Parsear y rellenar automáticamente';btn.disabled=false;}
      }
      return;
    }
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:600,
        messages:[{role:'user',content:buildParsePrompt(msg)}]})
    });
    if(!resp.ok){
      if(resp.status===401)throw new Error('API Key inválida');
      throw new Error('API '+resp.status);
    }
    const data=await resp.json();
    const raw=(data.content?.[0]?.text||'{}').replace(/```json?|```/g,'').trim();
    let p;
    try{p=JSON.parse(raw);}catch(pe){throw new Error('respuesta inválida');}
    const n=aplicarParseResult(p);
    _draft._showParser=false;
    renderOrderSheet();
    toast(`✨ ${n} campo(s) rellenados con IA — revisa y completa`,'ok');
  }catch(e){
    // ── FALLBACK: la IA falló (CORS/red) → usar lo del parser local ──
    if(camposLocal>0){
      const n=aplicarParseResult(local);
      _draft._showParser=false;renderOrderSheet();
      toast(`⚡ ${n} campo(s) del mensaje (IA no disponible) — completa el resto`,'ok');
    }else{
      toast('No se pudo analizar el mensaje — rellena manual','bad');
      if(btn){btn.textContent='✨ Parsear y rellenar automáticamente';btn.disabled=false;}
    }
  }
}

async function crearTraslado(){
  const orig=document.getElementById('trOrig')?.value;
  const dest=document.getElementById('trDest')?.value;
  const prod=document.getElementById('trProd')?.value;
  const cant=parseInt(document.getElementById('trCant')?.value)||0;
  const nota=document.getElementById('trNota')?.value||'';
  if(orig===dest){toast('Sedes origen y destino deben ser distintas','bad');return;}
  if(cant<=0){toast('Cantidad inválida','bad');return;}
  const prods=await dbAll('productos');const sedes=await dbAll('sedes');
  const pInfo=prods.find(p=>p.id===prod);const origInfo=sedes.find(s=>s.id===orig);const destInfo=sedes.find(s=>s.id===dest);
  // OUT inmediato de origen
  const mvId=uid('mv');
  await dbPut('movimientos',{id:mvId,fecha:Date.now(),tipo:'OUT',sedeId:orig,productoId:prod,cantidad:cant,
    nota:`🚚 Traslado en tránsito → ${destInfo?.codigo||dest}${nota?' · '+nota:''}`});
  // Registro de traslado
  const trId=uid('tr');
  await dbPut('traslados',{id:trId,fecha:Date.now(),estado:'EN_TRANSITO',
    sedeOrigenId:orig,sedeOrigenCod:origInfo?.codigo||orig,
    sedeDestinoId:dest,sedeDestinoCod:destInfo?.codigo||dest,
    productoId:prod,productoVersion:pInfo?.version||'?',
    cantidadEnviada:cant,cantidadRecibida:null,
    nota,creadoPor:S.user.nombre,movOutId:mvId,movInId:null,
    fechaEnvio:Date.now(),fechaRecepcion:null});
  toast('Traslado creado — stock descontado de '+origInfo?.codigo,'ok');
  closeSheet();viewInv();
}

async function confirmarRecepcion(trId){
  const t=await dbGet('traslados',trId);if(!t)return;
  const cant=parseInt(document.getElementById('recCant')?.value)||0;
  const nota=document.getElementById('recNota')?.value||'';
  if(cant<=0){toast('Ingresa la cantidad recibida','bad');return;}
  // Crear IN en destino con la cantidad REAL recibida
  const mvId=uid('mv');
  await dbPut('movimientos',{id:mvId,fecha:Date.now(),tipo:'IN',sedeId:t.sedeDestinoId,productoId:t.productoId,cantidad:cant,
    nota:`✓ Traslado recibido de ${t.sedeOrigenCod}${cant!==t.cantidadEnviada?' (enviadas '+t.cantidadEnviada+')':''}${nota?' · '+nota:''}`});
  // Si hubo diferencia, crear ajuste en origen (revertir la diferencia)
  if(cant<t.cantidadEnviada){
    const diff=t.cantidadEnviada-cant;
    await dbPut('movimientos',{id:uid('mv'),fecha:Date.now(),tipo:'IN',sedeId:t.sedeOrigenId,productoId:t.productoId,cantidad:diff,
      nota:`Ajuste: ${diff} u no llegaron en traslado #${trId.slice(-4)}`});
  }
  // Actualizar traslado
  await dbPut('traslados',{...t,estado:'RECIBIDO',cantidadRecibida:cant,movInId:mvId,
    fechaRecepcion:Date.now(),recibidoPor:S.user.nombre,notaRecepcion:nota});
  const diff=t.cantidadEnviada-cant;
  toast(`Recepción confirmada: ${cant} u en stock${diff>0?' · '+diff+' u devueltas a '+t.sedeOrigenCod:''}` ,'ok');
  closeSheet();viewInv();
}

async function cancelarTraslado(trId){
  confirmSheet('¿Cancelar este traslado?','El stock descontado se devolverá a la sede origen.',async()=>{
    const t=await dbGet('traslados',trId);if(!t)return;
    // Revertir el OUT de origen
    await dbPut('movimientos',{id:uid('mv'),fecha:Date.now(),tipo:'IN',sedeId:t.sedeOrigenId,productoId:t.productoId,cantidad:t.cantidadEnviada,
      nota:`Traslado cancelado — stock devuelto`});
    await dbPut('traslados',{...t,estado:'CANCELADO',fechaRecepcion:Date.now(),recibidoPor:S.user.nombre});
    toast('Traslado cancelado — stock devuelto a '+t.sedeOrigenCod,'ok');closeSheet();viewInv();
  });
}

/* ============================================================
   BUSCADOR INTELIGENTE
   Búsqueda local instantánea + respuesta de IA para preguntas
   ============================================================ */
let _srchDebounce=null;
let _srchLastQ='';

function openSearch(){
  document.getElementById('searchOverlay').classList.add('show');
  document.body.style.overflow='hidden';
  setTimeout(()=>document.getElementById('searchInput')?.focus(),80);
  renderSearchHome();
}
function closeSearch(){
  document.getElementById('searchOverlay').classList.remove('show');
  document.body.style.overflow='';
  const inp=document.getElementById('searchInput');
  if(inp)inp.value='';
  _srchLastQ='';
}
// Cerrar con Escape global
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('searchOverlay')?.classList.contains('show'))closeSearch();});

function onSearchInput(val){
  clearTimeout(_srchDebounce);
  const q=val.trim();
  if(!q){renderSearchHome();return;}
  if(q===_srchLastQ)return;
  _srchLastQ=q;
  // Búsqueda local instantánea
  localSearch(q).then(res=>renderSearchResults(q,res));
  // IA para preguntas complejas (debounce 900ms)
  const esCompleja=q.length>12||/cuánto|cuanto|total|venta|pedido|frank|adnan|roque|marie|sede|mes|semana|hoy|pagar|deb[eé]|ganancia|stock|inventario|quién|quien|cuál|cual|\?/i.test(q);
  if(esCompleja){
    showAiThinking();
    _srchDebounce=setTimeout(()=>aiSearch(q),900);
  }
}

/* ── Búsqueda local sobre pedidos ── */
async function localSearch(q){
  const ql=q.toLowerCase().replace(/\s+/g,' ');
  const peds=await dbAll('pedidos');
  const sedes=await dbAll('sedes'); S.cache.sedes=sedes;
  // Detectar si es número de teléfono
  const isPhone=q.replace(/\D/g,'').length>=7;
  const pedResults=peds.filter(p=>{
    const n=(p.cliente?.nombre||'').toLowerCase();
    const tel=(p.cliente?.telefono||'').replace(/\D/g,'');
    const cod=(p.codigo||'').toLowerCase();
    const vend=(p.vendedorNombre||'').toLowerCase();
    const zona=(p.cliente?.zona||'').toLowerCase();
    const ag=(p.agenciaEnvio||'').toLowerCase();
    if(isPhone)return tel.includes(q.replace(/\D/g,''));
    return n.includes(ql)||cod.includes(ql)||vend.includes(ql)||zona.includes(ql)||ag.includes(ql);
  }).sort((a,b)=>b.fecha-a.fecha).slice(0,7);
  return{pedidos:pedResults,sedes};
}

    <div class="srch-group">
      <div class="srch-label">Pedidos encontrados (${pedidos.length})</div>
      ${pedidos.map(p=>{
        const s=sedesMap[p.sedeId];const em=estadoMeta(p.estado);
        const debe=(p.totalUSD||0)-(p.totalPagadoUSD||0);
        return`<div class="srch-item" onclick="closeSearch();openOrder('${p.id}')">
          <div class="av"><span class="tag t-${p.canal}" style="font-size:10px">${p.canal}</span></div>
          <div class="gr">
            <div class="t">${esc(p.cliente?.nombre||'—')}</div>
            <div class="s">${p.codigo} · ${s?.codigo||''} · <span style="color:${em.c}">${em.n}</span>${debe>0.5?' · <span style="color:var(--warn)">debe '+usd(debe)+'</span>':''}</div>
          </div>
          <div class="r" style="color:var(--glow)">${usd(p.totalUSD||0)}</div>
        </div>`;}).join('')}
    </div>`:
    `<div style="color:var(--muted2);font-size:13px;padding:8px 0">Sin pedidos con "<b style="color:var(--white)">${esc(q)}</b>"</div>`;

  // Acciones rápidas según la query
  const ql=q.toLowerCase();
  let accionesHTML='';
  const acciones=[];
  if(/inventario|stock|unidades/i.test(ql))acciones.push({ic:'▦',t:'Ver inventario',fn:"closeSearch();go('inv')"});
  if(/finanza|ingreso|gasto|caja|utilidad/i.test(ql))acciones.push({ic:'$',t:'Ver finanzas',fn:"closeSearch();go('fin')"});
  if(/reporte|venta|canal|sede/i.test(ql))acciones.push({ic:'📊',t:'Ver reportes',fn:"closeSearch();go('reportes')"});
  if(/nómin|comision|pagar|frank|marie/i.test(ql))acciones.push({ic:'💰',t:'Ver nómina',fn:"closeSearch();go('nomina')"});
  if(/pedido|despach|envío|entrega/i.test(ql))acciones.push({ic:'🛵',t:'Ver despacho',fn:"closeSearch();go('despacho')"});
  if(acciones.length)accionesHTML=`<div class="srch-group">
    <div class="srch-label">Acciones rápidas</div>
    ${acciones.map(a=>`<div class="srch-item" onclick="${a.fn}">
      <div class="av">${a.ic}</div><div class="gr"><div class="t">${a.t}</div></div>
    </div>`).join('')}

  el.innerHTML=`<div id="aiAnswer"></div>${accionesHTML}${pedHTML}`;
}

/* ── Búsqueda con IA para preguntas complejas ── */
async function aiSearch(q){
  const conf=await cfg();
  if(!conf.anthropicKey){
    const el=document.getElementById('aiAnswer');
    if(el)el.innerHTML=`<div class="ai-box"><div class="lbl">IA · Firefly</div><div class="ans" style="color:var(--muted)">Añade tu Anthropic API Key en Ajustes para activar respuestas de IA.</div></div>`;
    return;
  }
  // Construir contexto con datos reales
  const[peds,prods,sedes,emps,sm]=await Promise.all([dbAll('pedidos'),dbAll('productos'),dbAll('sedes'),dbAll('nominaEmpleados'),stockMap()]);
  const now=Date.now();
  const mesVentas=peds.filter(p=>p.estado!=='CANCELADO'&&thisMonth(p.fecha));
  const porVend={};mesVentas.forEach(p=>{const k=p.vendedorNombre||'?';porVend[k]=(porVend[k]||0)+(p.subtotalUSD||0);});
  const stockResumen=prods.map(p=>{return sedes.map(s=>`${p.version} en ${s.codigo}: ${sm[s.id+'|'+p.id]||0}u`).join(', ');}).join(' | ');
  const pendientes=peds.filter(p=>['POR_DESPACHAR','DESPACHADO','EN_CAMINO'].includes(p.estado));
  const ctx={
    hoy:new Date().toLocaleDateString('es-VE'),
    ventas_mes_usd:mesVentas.reduce((a,p)=>a+(p.subtotalUSD||0),0).toFixed(2),
    pedidos_mes:mesVentas.length,
    pedidos_activos:pendientes.length,
    ventas_por_vendedor:JSON.stringify(porVend),
    stock:stockResumen,
    sedes:sedes.map(s=>s.codigo+':'+s.nombre).join(', '),
    total_pedidos_historico:peds.length
  };
  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':conf.anthropicKey,
        'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:300,
        messages:[{role:'user',content:`Eres el asistente interno del panel operativo de Firefly Vzla (empresa venezolana de linternas de cabeza).

Datos actuales del negocio:
${JSON.stringify(ctx,null,2)}

Pregunta: "${q}"

Responde en español, directo y breve (máximo 2-3 oraciones). Usa los datos para dar números exactos cuando sea posible. Si la pregunta es ambigua, responde lo más útil que puedas.`}]})
    });
    const data=await resp.json();
    const ans=(data.content?.[0]?.text||'').trim();
    const el=document.getElementById('aiAnswer');
    if(el&&ans)el.innerHTML=`<div class="ai-box">
      <div class="lbl">✦ IA · Firefly</div>
      <div class="ans">${esc(ans)}</div>
    </div>`;
  }catch(e){
    const el=document.getElementById('aiAnswer');
    if(el)el.innerHTML='';
  }
}


/* ── updateTasaRapida ── */
async function updateTasaRapida(val){
  S.cache.cfg=null;
  if(!val||val<=0)return;
  const c=await cfg();c.tasaActual=val;c.tasaTs=Date.now();c.tasaHist=[...(c.tasaHist||[]),{ts:Date.now(),v:val}].slice(-120);
  await dbPut('config',c);S.cache.cfg=c;
  toast('Tasa actualizada: '+val+' Bs/$','ok');
}

/* ── applyPromo ── */
function applyPromo(promoId){
  const promo=(S.cache.promos||[]).find(p=>p.id===promoId);
  if(!promo)return;
  const prod=(S.cache.prods||[]).find(p=>p.id===promo.productoId&&p.activo);
  if(!prod){toast('Producto no disponible','bad');return;}
  const punit=promo.precioTotal/promo.cantidad;
  const pfinal=_draft._divisas?Math.round(punit*(1-(prod.divisasPct||0)/100)*100)/100:Math.round(punit*100)/100;
  _draft.items=[{productoId:prod.id,version:prod.version,nombre:prod.nombre,
    cantidad:promo.cantidad,precio:pfinal,_promoId:promo.id,_promoNombre:promo.nombre}];
  renderOrderSheet();
  toast(promo.nombre+' aplicado ✓','ok');
}

   LIBRO DE MOVIMIENTOS — Auditoría completa
   Consolida: ventas cobradas, vueltos Bs, retiros, gastos,
   conversiones, nómina, garantías en una línea de tiempo
   ============================================================ */
const AUDIT_TIPOS={
  VENTA:     {ic:'💰',label:'Venta cobrada',   col:'var(--ok)'},
  VUELTO_BS: {ic:'💱',label:'Vuelto en Bs',    col:'var(--warn)'},
  RETIRO:    {ic:'↑', label:'Retiro de caja',  col:'var(--bad)'},
  DEPOSITO:  {ic:'↓', label:'Depósito',        col:'var(--ok)'},
  GASTO:     {ic:'📤',label:'Gasto operativo', col:'var(--bad)'},
  CONVERSION:{ic:'🔄',label:'Conversión Bs→$', col:'var(--info)'},
  NOMINA:    {ic:'👤',label:'Nómina',          col:'var(--purple)'},
  GARANTIA:  {ic:'🔧',label:'Garantía',        col:'var(--muted)'},
};

async function buildAuditEntries(desde, hasta){
  const [peds,cajaMvs,egr,convs,invMvs,nomPagos,sedes,ingM]=await Promise.all([
    dbAll('pedidos'),dbAll('cajaMovs'),dbAll('egresos'),
    dbAll('conversiones'),dbAll('movimientos'),dbAll('nominaPagos'),dbAll('sedes'),dbAll('ingresos')
  ]);
  const sedeMap={};sedes.forEach(s=>sedeMap[s.id]=s.codigo);
  const entries=[];

  // 1. Ventas cobradas (de pagos en pedidos)
  peds.forEach(p=>{
    if(p.estado==='CANCELADO')return;
    (p.pagos||[]).forEach(pg=>{
      const ts=pg.ts||p.fecha;
      if(ts<desde||ts>hasta)return;
      entries.push({fecha:ts,tipo:'VENTA',pedidoId:p.id,metodo:pg.metodo,categoria:'Ventas',canal:p.canal,comprobante:pg.comprobanteURL||'',
        concepto:`${p.cliente?.nombre||'Cliente'} · ${pg.metodo}`,
        ref:p.codigo,sede:sedeMap[p.sedeId]||p.sedeId||'—',
        montoUSD:pg.montoUSD||0,montoBs:pg.montoBs||0,tasa:pg.tasa||0,
        responsable:p.vendedorNombre||'—',signo:1,
        detalle:`${esc(p.cliente?.nombre||'')} · ${esc(p.cliente?.telefono||'')} · ${pg.metodo}`});
    });
  });

  // 2. Movimientos de caja (retiros, vueltos, depósitos)
  cajaMvs.forEach(m=>{
    if(m.fecha<desde||m.fecha>hasta)return;
    const tipo=m.esVueltoBs?'VUELTO_BS':m.tipo==='ENTRADA'?'DEPOSITO':'RETIRO';
    entries.push({fecha:m.fecha,tipo,cajaId:m.id,anulado:!!m._anulado,anuladoMotivo:m._anuladoMotivo||'',
      concepto:m.concepto,
      ref:m.ref||'—',sede:sedeMap[m.sedeId]||m.sedeId||'—',
      montoUSD:m.montoUSD||0,montoBs:m.montoBs||0,tasa:m.tasa||0,
      responsable:m.responsable||'—',signo:m.tipo==='ENTRADA'?1:-1,
      detalle:m.detalle||m.nota||''});
  });

  // 3. Gastos operativos
  egr.forEach(e=>{
    if(e.fecha<desde||e.fecha>hasta)return;
    if(e._autoNomina)return; // el pago de nómina ya aparece como NOMINA
    entries.push({fecha:e.fecha,tipo:'GASTO',gastoId:e.id,categoria:e.categoria||'',metodo:e.metodoPago||'',proveedor:e.proveedor||'',comprobante:e.comprobanteURL||'',anulado:!!e._anulado,anuladoMotivo:e._anuladoMotivo||'',
      concepto:`${e.categoria}: ${e.descripcion||''}`,
      ref:'—',sede:sedeMap[e.sedeId]||'General',
      montoUSD:e.montoUSD||0,montoBs:e.montoBs||0,tasa:e.tasa||0,
      responsable:e.responsable||'—',signo:-1,detalle:e.descripcion||''});
  });

  // 4. Conversiones Bs→$
  convs.forEach(cv=>{
    if(cv.fecha<desde||cv.fecha>hasta)return;
    entries.push({fecha:cv.fecha,tipo:'CONVERSION',convId:cv.id,categoria:'Transferencia',metodo:cv.metodo||'',
      concepto:`${cv.direccion==='USD_BS'?'USD → Bs':'Bs → USD'} · ${cv.receptor||''}${cv.referencia?' · '+cv.referencia:''}`,
      ref:'—',sede:'—',
      montoUSD:cv.totalUSD||0,montoBs:cv.totalBs||0,tasa:cv.tasaConv||0,
      responsable:cv.responsable||'—',signo:1,
      detalle:`${num(cv.totalBs)} Bs a ${usd(cv.totalUSD)} · tasa ${cv.tasaConv}`});
  });

  // 5. Nómina
  nomPagos.forEach(np=>{
    if(np.fecha<desde||np.fecha>hasta)return;
    entries.push({fecha:np.fecha,tipo:'NOMINA',categoria:'Nómina',metodo:np.metodoPago||'',anulado:np.estado==='ANULADO'||!!np._anulado,anuladoMotivo:np._anuladoMotivo||'',comprobante:np.comprobanteURL||'',
      concepto:`${np.empleadoNombre} · ${np.periodo||''}`,
      ref:'—',sede:'—',
      montoUSD:np.total||0,montoBs:0,tasa:0,
      responsable:np.pagadoPor||'—',signo:-1,
      detalle:`${np.metodoPago} · comisión ${usd(np.comision||0)}${np.salario?'+salario '+usd(np.salario):''}`});
  });

  // 6. Garantías (solo las que tienen costo)
  invMvs.filter(m=>m.esGarantia).forEach(m=>{
    if(m.fecha<desde||m.fecha>hasta)return;
    entries.push({fecha:m.fecha,tipo:'GARANTIA',
      concepto:m.nota||'Garantía/Intercambio',
      ref:'—',sede:sedeMap[m.sedeId]||'—',
      montoUSD:0,montoBs:0,tasa:0,
      responsable:'—',signo:0,detalle:m.nota||''});
  });

  // 7. Ingresos manuales (otros ingresos, devoluciones, ajustes)
  ingM.forEach(x=>{
    if(x.fecha<desde||x.fecha>hasta)return;
    const T={OTRO:'INGRESO',DEVOLUCION:'DEVOLUCION',AJUSTE:'AJUSTE'}[x.tipo]||'INGRESO';
    entries.push({fecha:x.fecha,tipo:T,ingresoId:x.id,categoria:{INGRESO:'Otros ingresos',DEVOLUCION:'Devoluciones',AJUSTE:'Ajustes'}[T],
      metodo:x.metodo||'',canal:x.canal||'',comprobante:x.comprobanteURL||'',anulado:!!x._anulado,anuladoMotivo:x._anuladoMotivo||'',
      concepto:x.descripcion||'',ref:'—',sede:sedeMap[x.sedeId]||'General',
      montoUSD:x.montoUSD||0,montoBs:0,tasa:0,responsable:x.responsable||'—',signo:x.signo||1,detalle:x.nota||''});
  });
  return entries.sort((a,b)=>b.fecha-a.fecha);
}

function exportarLibro(){
  const es=window._lbEntries||[];if(!es.length){toast('No hay movimientos para exportar','bad');return;}
  const q=s=>`"${String(s??'').replace(/"/g,'""')}"`;
  const rows=[['Fecha','Tipo','Concepto','Referencia','Sede','Monto USD','Monto Bs','Tasa','Responsable','Anulado'].map(q).join(',')]
    .concat(es.map(e=>[new Date(e.fecha).toLocaleString('es-VE'),e.tipo,e.concepto,e.ref,e.sede,(e.signo<0?-1:1)*e.montoUSD,e.montoBs,e.tasa,e.responsable,e.anulado?'Sí':''].map(q).join(',')));
  const blob=new Blob(['﻿'+rows.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`libro-firefly-${new Date().toISOString().slice(0,10)}.csv`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
  toast('Libro exportado (CSV)','ok');
}

/* ── Importar JSON (respaldo o histórico de pedidos) ── */
async function importData(file){
  if(!file)return;
  try{
    const txt=await file.text();
    const data=JSON.parse(txt);

    // Detectar formato: respaldo completo vs import de pedidos
    const isPedidosOnly=!!(data.pedidos&&!data.config&&Object.keys(data).filter(k=>!k.startsWith('_')).length<=2);
    const totalItems=isPedidosOnly
      ?(data.pedidos||[]).length
      :STORES_EXP.reduce((a,s)=>a+(data[s]?.length||0),0);

    const desc=isPedidosOnly
      ?`Se cargarán <b>${totalItems} pedidos históricos</b> a Firestore.`
      :`Se cargarán <b>${totalItems} registros</b> de respaldo a Firestore.`;

    confirmSheet(`¿Importar datos?`,desc,async()=>{
      let n=0;
      if(isPedidosOnly){
        for(const p of data.pedidos||[]){await dbPut('pedidos',p);n++;}
      }else{
        for(const s of STORES_EXP){
          if(data[s]){for(const o of data[s]){await dbPut(s,o);n++;}}
        }
      }
      S.cache={};
      toast(`${n} registros importados ✓`,'ok');
      closeSheet();go('dash');
    });
  }catch(e){toast('Archivo inválido: '+e.message,'bad');}
}


/* ============================================================
   MAYORISTAS / CONSIGNACIONES
   Ferreterías y empresas que revenden el producto
   ============================================================ */
async function adminMayoristas(){
  const [mayors,prods]=await Promise.all([dbAll('mayoristas'),dbAll('productos')]);
  const pedsMayor=await dbAll('pedidos').then(ps=>ps.filter(p=>p.canal==='MAYOR'));
  openSheet(`<div class="sh-head"><h3>🏭 Mayoristas / Consignaciones</h3><button class="btn pri sm" onclick="editMayorista()">+ Nuevo</button></div>
   <div class="hintline" style="margin-bottom:12px">Clientes al mayor o en consignación. Al crear un pedido con canal "Mayor" se vinculan automáticamente.</div>
   ${mayors.length?`<div class="list">
     ${mayors.map(m=>{
       const suyos=pedsMayor.filter(p=>p.mayorId===m.id);
       const pendiente=suyos.reduce((a,p)=>a+(p.totalUSD||0)-(p.totalPagadoUSD||0),0);
       const entregado=suyos.reduce((a,p)=>a+(p.items||[]).reduce((b,i)=>b+i.cantidad,0),0);
       return`<div class="li" onclick="editMayorista('${m.id}')">
         <div class="av" style="font-size:18px;background:var(--panel3)">🏭</div>
         <div class="gr">
           <div class="t">${esc(m.nombre)} ${!m.activo?'<span class="tag" style="color:var(--muted)">inactivo</span>':''}</div>
           <div class="s">${esc(m.contacto||'')}${m.telefono?' · '+esc(m.telefono):''}</div>
           <div class="s">${m.condicion||'CONTADO'} · precio ${usd(m.precioUnitario||0)}/u</div>
         </div>
         <div style="text-align:right">
           <div style="font-size:12px;font-weight:700;color:var(--glow)">${entregado}u</div>
           ${pendiente>0.5?`<div style="font-size:11px;color:var(--warn)">debe ${usd(pendiente)}</div>`:
           `<div style="font-size:11px;color:var(--ok)">al día</div>`}
         </div>
       </div>`;}).join('')}
   </div>`:
   emptyState('🏭','Sin mayoristas registrados','Toca "+ Nuevo" para agregar una ferretería o empresa.')}`);
}

async function editMayorista(id){
  const[m,prods]=await Promise.all([
    id?dbGet('mayoristas',id):Promise.resolve({id:null,nombre:'',rif:'',contacto:'',telefono:'',email:'',
      precioUnitario:0,condicion:'CONTADO',diasCredito:0,limiteUnidades:0,activo:true,notas:''}),
    dbAll('productos')
  ]);
  window._emay={...m};
  openSheet(`<div class="sh-head"><h3>${id?'Editar':'Nuevo'} mayorista</h3></div>
   <div class="row">
     <div class="field"><label>Nombre empresa / persona <span class="req">*</span></label>
       <input class="inp" value="${esc(m.nombre)}" oninput="_emay.nombre=this.value" placeholder="Ferretería El Constructor"></div>
     <div class="field"><label>RIF / RUC</label>
       <input class="inp mono" value="${esc(m.rif||'')}" oninput="_emay.rif=this.value" placeholder="J-12345678-9"></div>
   </div>
   <div class="row">
     <div class="field"><label>Contacto</label>
       <input class="inp" value="${esc(m.contacto||'')}" oninput="_emay.contacto=this.value" placeholder="Nombre del comprador"></div>
     <div class="field"><label>Teléfono</label>
       <input class="inp mono" inputmode="tel" value="${esc(m.telefono||'')}" oninput="_emay.telefono=this.value"></div>
   </div>
   <div class="sec-title" style="margin-top:18px">Condiciones comerciales</div>
   <div class="row">
     <div class="field"><label>Precio por unidad $ <span class="req">*</span></label>

/* ============================================================
   CHART HELPERS — SVG donut + barras comparativas verticales
   ============================================================ */
const CHART_PALETTE=['#CDEB45','#5db4f5','#f5b945','#b78bf0','#54d684','#ff6b5e','#f7931a','#7dd3fc'];

function donutChartSVG(data,opts={}){
  // data: [{label,value}]
  const size=opts.size||168, stroke=opts.stroke||22, r=(size-stroke)/2, cx=size/2, cy=size/2;
  const total=data.reduce((a,d)=>a+d.value,0)||1;
  const C=2*Math.PI*r;
  let acc=0;
  const segs=data.map((d,i)=>{
    const frac=d.value/total, len=frac*C;
    const dasharray=`${len} ${C-len}`;
    const dashoffset=C*0.25 - acc; // empezar arriba (12 o'clock)
    acc+=len;
    const col=d.color||CHART_PALETTE[i%CHART_PALETTE.length];
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col}" stroke-width="${stroke}"
      stroke-dasharray="${dasharray}" stroke-dashoffset="${dashoffset}" stroke-linecap="butt"
      transform="rotate(-90 ${cx} ${cy})" style="transition:stroke-dasharray .6s"/>`;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${segs}</svg>`;
}

function donutWithLegend(data,opts={}){
  const total=data.reduce((a,d)=>a+d.value,0)||1;
  const svg=donutChartSVG(data,opts);
  const centerLabel=opts.centerLabel||'';
  const legend=data.map((d,i)=>{
    const col=d.color||CHART_PALETTE[i%CHART_PALETTE.length];
    const pct=Math.round(d.value/total*100);
    return `<div style="display:flex;align-items:center;gap:8px;padding:6px 0">
      <span style="width:9px;height:9px;border-radius:50%;background:${col};flex:none"></span>
      <span style="flex:1;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(d.label)}</span>
      <span class="mono" style="font-size:11.5px;color:var(--muted);flex:none">${pct}%</span>
      ${opts.showVal?`<span class="mono" style="font-size:11.5px;color:var(--white);min-width:55px;text-align:right;flex:none">${opts.fmtVal?opts.fmtVal(d.value):d.value}</span>`:''}
    </div>`;
  }).join('');
  return `<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
    <div style="position:relative;flex:none">${svg}
      ${centerLabel?`<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
        <div style="font-family:var(--mono);font-weight:800;font-size:17px">${centerLabel}</div>
        ${opts.centerSub?`<div style="font-size:9px;color:var(--muted2);text-transform:uppercase;letter-spacing:.05em">${opts.centerSub}</div>`:''}
      </div>`:''}
    </div>
    <div style="flex:1;min-width:140px">${legend}</div>
  </div>`;
}

/* Barras verticales comparativas (tipo Shopify "top staff/products") */
function vBarCompareSVG(data,opts={}){
  // data: [{label,value,sublabel}]
  if(!data.length)return '<div class="empty" style="padding:14px">Sin datos</div>';
  const max=Math.max(1,...data.map(d=>d.value));
  const H=opts.height||130;
  return `<div style="display:flex;align-items:flex-end;gap:${opts.gap||10}px;height:${H+38}px;padding:4px 2px 0;overflow-x:auto">
    ${data.map((d,i)=>{
      const h=Math.max(4,Math.round(d.value/max*H));
      const col=d.color||CHART_PALETTE[i%CHART_PALETTE.length];
      return `<div style="display:flex;flex-direction:column;align-items:center;flex:none;min-width:${opts.barW||44}px">
        <div class="mono" style="font-size:10.5px;font-weight:700;color:${col};margin-bottom:4px;white-space:nowrap">${opts.fmtVal?opts.fmtVal(d.value):d.value}</div>
        <div style="width:${opts.barInnerW||26}px;height:${h}px;background:${col};border-radius:6px 6px 3px 3px;transition:height .5s"></div>
        <div style="font-size:10px;color:var(--muted);margin-top:6px;text-align:center;max-width:${opts.barW||44}px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(d.label)}</div>
        ${d.sublabel?`<div style="font-size:9px;color:var(--muted2)">${d.sublabel}</div>`:''}
      </div>`;
    }).join('')}
  </div>`;
}

/* ── Borrar TODOS los datos del import: pedidos + movimientos + egresos + cajaMovs relacionados ── */
async function borrarPedidosImportados(){
  const todos = await dbAll('pedidos');
  const importados = todos.filter(p => p._importado === true);
  if(!importados.length){toast('No hay pedidos importados para borrar — ya están limpios ✓','ok');return;}

  const ids = new Set(importados.map(p => p.id));
  const [movs,egrs,cajaMvs]=await Promise.all([dbAll('movimientos'),dbAll('egresos'),dbAll('cajaMovs')]);

  // Registros vinculados a los pedidos importados
  const movsRel=movs.filter(m=>m.refPedidoId&&ids.has(m.refPedidoId));
  const egrsRel=egrs.filter(e=>e.refPedidoId&&ids.has(e.refPedidoId));
  const cajaMvsRel=cajaMvs.filter(c=>c.ref&&ids.has(c.ref));

  const resumen=[
    `• <b>${importados.length}</b> pedidos del Excel`,
    movsRel.length?`• <b>${movsRel.length}</b> movimientos de inventario`:'',
    egrsRel.length?`• <b>${egrsRel.length}</b> gastos relacionados`:'',
    cajaMvsRel.length?`• <b>${cajaMvsRel.length}</b> movimientos de caja`:'',
  ].filter(Boolean).join('<br>');

  confirmSheet(
    `¿Borrar todo el import?`,
    `Se eliminarán permanentemente:<br>${resumen}<br><br>Los pedidos creados <b>manualmente NO se tocan</b>. Esta acción no se puede deshacer.`,
    async () => {
      const allToDelete=[
        ...importados.map(p=>['pedidos',p.id]),
        ...movsRel.map(m=>['movimientos',m.id]),
        ...egrsRel.map(e=>['egresos',e.id]),
        ...cajaMvsRel.map(c=>['cajaMovs',c.id]),
      ];
      const total=allToDelete.length, batch=20;
      let done=0;
      for(let i=0;i<allToDelete.length;i+=batch){
        await Promise.all(allToDelete.slice(i,i+batch).map(([col,id])=>dbDel(col,id)));
        done+=Math.min(batch,allToDelete.length-i);
        toast(`Borrando… ${done}/${total}`,'ok');
      }
      S.cache.peds=null;invalidarCache('pedidos');
      toast(`Listo — ${total} registros eliminados. Sistema limpio ✓`,'ok');
      closeSheet();go('dash');
    }
  );
}

  const hh=Math.round(m/60);if(hh<24)return `Hace ${hh} h`;
  const d=Math.round(hh/24);return d===1?'Ayer':`Hace ${d} días`;
}

function actividadMotos(){

  const ev=[];

    const d=M.delDe(p);if(!d)return;
    const tl=(p.timeline||[]).filter(t=>verbo[t.estado]);
    if(tl.length)tl.forEach(t=>ev.push({p,d,est:t.estado,ts:t.ts}));
    else if(verbo[p.estado])ev.push({p,d,est:p.estado,ts:p.estado==='ENTREGADO'?entregadoEl(p):p.fecha});

async function motoEntregar(pedId){
  const p=await dbGet('pedidos',pedId);if(!p)return;
  const fileInput=document.getElementById('motoFoto_'+pedId);
  const file=fileInput?.files?.[0];
  if(!file){toast('Toma o sube la foto del comprobante primero','bad');return;}
  const btn=document.getElementById('motoEntregarBtn_'+pedId);
  if(btn){btn.textContent='📤 Subiendo foto…';btn.disabled=true;}
  try{
    // Subir foto a Firebase Storage
    const ext=file.name.split('.').pop()||'jpg';
    const path=`comprobantes/${pedId}/${Date.now()}.${ext}`;
    const ref=storage.ref(path);
    await ref.put(file);
    const fotoURL=await ref.getDownloadURL();

    // Registrar pago si el cliente pagó al momento
    const debe=(p.totalUSD||0)-(p.totalPagadoUSD||0);
    if(debe>0.5){
      const met=document.getElementById('motoPagoMet_'+pedId)?.value||'Cash $';
      const monto=parseFloat(document.getElementById('motoPagoMonto_'+pedId)?.value)||debe;
      const refInput=document.getElementById('motoPagoRef_'+pedId)?.value?.trim()||'';
      // Validar referencia para métodos electrónicos
      if(['Pago Móvil','Zelle','Binance','PayPal'].includes(met)&&!refInput){
        toast('Falta los últimos 4 dígitos de la referencia','bad');
        if(btn){btn.textContent='✓ Confirmar entrega';btn.disabled=false;}
        return;
      }
      const pg={metodo:met,montoUSD:monto,montoBs:0,tasa:0,ref:refInput||'entrega',
        ts:Date.now(),por:S.user.nombre,comprobanteURL:fotoURL};
      p.pagos=[...(p.pagos||[]),pg];
      p.totalPagadoUSD=(p.totalPagadoUSD||0)+monto;
    }

    // Cerrar la orden
    p.estado='ENTREGADO';
    p.motoEstado='ENTREGADO';
    p.motoEntregadoEl=Date.now();
    p.comprobanteEntregaURL=fotoURL;
    p.timeline=[...(p.timeline||[]),{estado:'ENTREGADO',ts:Date.now(),por:S.user.nombre,nota:'Entregado con comprobante 📸'}];
    S.cache.peds=null;invalidarCache('pedidos');
    await dbPut('pedidos',p);
    toast('🎉 Entrega completada — comprobante guardado','ok');
    viewMoto();
  }catch(e){
    toast('Error al subir: '+(e.message||e),'bad');
    if(btn){btn.textContent='✓ Confirmar entrega';btn.disabled=false;}
  }
}

Producto: ${items}

function cobroInstrucciones(metodo,pagosInfo,monto,pid){
  const pi=pagosInfo||PAGOS_INFO_DEFAULT;
  const _act=(S.cache.cfg&&S.cache.cfg.pagosActivos)||{},_k={'Zelle':'zelle','PayPal':'paypal','Binance':'binance','Pago Móvil':'pm'}[metodo];
  if(_k&&_act[_k]===false)return `<div class="warnbox">${ic('alert')}<span>${esc(metodo)} está desactivado en Ajustes → Cobros Firefly. Pide al cliente otro método.</span></div>`;

  const tasa=S.cache.cfg?.tasaActual||0;
  const montoBs=monto&&tasa?Math.round(monto*tasa):0;
  const qrData=(txt)=>`https://api.qrserver.com/v1/create-qr-code/?size=180x180&bgcolor=0A0A0B&color=CDEB45&data=${encodeURIComponent(txt)}`;
  if(metodo==='Pago Móvil'){
    const pmTexto=`Pago Movil Firefly\n${pi.pmBanco}\nTel: ${pi.pmTelefono}\nCI: ${pi.pmCedula}${montoBs?`\nMonto: ${montoBs} Bs`:''}`;
    return `<div style="background:var(--panel3);border-radius:10px;padding:12px;text-align:center">
      <div class="eyebrow" style="margin-bottom:8px">💸 Datos para Pago Móvil</div>
      ${montoBs?`<div style="background:rgba(245,185,69,.12);border:1px solid rgba(245,185,69,.3);border-radius:10px;padding:10px;margin-bottom:10px">
